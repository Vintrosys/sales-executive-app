  <script>
    // ==================================================================
    //  Sales Executive App (client)
    //  Every server call goes through api('<method>') which posts to
    //  /api/method/sales_executive_app.api.<method>  (unchanged contract)
    // ==================================================================
    const API = '/api/method/sales_executive_app.api.';
    const TABS = ['day', 'visit', 'cust', 'report', 'map'];
    const S = {
      tab: 'day',
      user: null,
      status: null,
      shops: [],
      selectedShop: null,
      activeVisit: null,
      photos: { selfie: null, shop: null },
      cart: [],
      cartVisitName: null,
      catalog: [],
      meta: { customer_groups: [], territories: [] },
      reportDate: null,
      lastPos: null,
      dailyReportData: null,
      shopFilter: 'all',
      shopQuery: '',
      custFilter: 'all',
      custQuery: '',
    };

    const $ = id => document.getElementById(id);
    const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    // Safe string argument for inline handlers:  onclick="fn(${arg(value)})"
    const arg = v => esc(JSON.stringify(v == null ? '' : String(v)));
    const cssEsc = s => (window.CSS && CSS.escape) ? CSS.escape(s) : String(s).replace(/["\\]/g, '\\$&');
    const stripTags = s => String(s || '')
      .replace(/<br\s*\/?>/gi, ', ').replace(/<[^>]+>/g, ' ')
      .replace(/\s+,/g, ',').replace(/(,\s*)+/g, ', ').replace(/\s+/g, ' ')
      .trim().replace(/^,\s*|,\s*$/g, '');

    // ---------- Icons ----------
    const P = {
      pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
      clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
      store: '<path d="M4 9.5 5.5 4h13L20 9.5"/><path d="M4 9.5c0 1.6 1.3 2.8 2.7 2.8S9.3 11.1 9.3 9.5c0 1.6 1.2 2.8 2.7 2.8s2.7-1.2 2.7-2.8c0 1.6 1.2 2.8 2.6 2.8S20 11.1 20 9.5Z"/><path d="M5.5 12.2V20h13v-7.8"/><path d="M10 20v-4.5h4V20"/>',
      user: '<circle cx="12" cy="8" r="4"/><path d="M4 21v-.5A6.5 6.5 0 0 1 10.5 14h3a6.5 6.5 0 0 1 6.5 6.5v.5"/>',
      users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
      phone: '<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/>',
      nav: '<polygon points="3 11 22 2 13 21 11 13 3 11"/>',
      camera: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',
      check: '<path d="M20 6 9 17l-5-5"/>',
      plus: '<path d="M12 5v14M5 12h14"/>',
      minus: '<path d="M5 12h14"/>',
      search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
      route: '<circle cx="6" cy="19" r="2.5"/><circle cx="18" cy="5" r="2.5"/><path d="M8.5 19h8a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7h8"/>',
      layers: '<path d="m12 2 10 5-10 5L2 7l10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/>',
      locate: '<circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><path d="M12 1.5v3M12 19.5v3M1.5 12h3M19.5 12h3"/>',
      fit: '<path d="M8 3H5a2 2 0 0 0-2 2v3M21 8V5a2 2 0 0 0-2-2h-3M3 16v3a2 2 0 0 0 2 2h3M16 21h3a2 2 0 0 0 2-2v-3"/>',
      play: '<path d="M8 5.2v13.6a1 1 0 0 0 1.5.86l11-6.8a1 1 0 0 0 0-1.72l-11-6.8A1 1 0 0 0 8 5.2Z" fill="currentColor" stroke="none"/>',
      pause: '<rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor" stroke="none"/>',
      cal: '<rect x="3" y="4.5" width="18" height="16.5" rx="3"/><path d="M8 2.5v4M16 2.5v4M3 10h18"/>',
      copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
      share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
      print: '<path d="M6 9V2h12v7"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><rect x="6" y="14" width="12" height="8"/>',
      box: '<path d="M21 8 12 3 3 8v8l9 5 9-5V8Z"/><path d="m3 8 9 5 9-5M12 13v8"/>',
      road: '<path d="M5 21 9 3M19 21 15 3M12 5v2M12 11v2M12 17v2"/>',
      chev: '<path d="m6 9 6 6 6-6"/>',
      chevR: '<path d="m9 6 6 6-6 6"/>',
      chevL: '<path d="m15 6-6 6 6 6"/>',
      alert: '<path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0Z"/><path d="M12 9v4M12 17h.01"/>',
      battery: '<rect x="2" y="7" width="17" height="10" rx="2.5"/><path d="M22 11v2"/>',
      speed: '<path d="m12 14 4-4"/><path d="M3.3 19a10 10 0 1 1 17.4 0"/>',
      close: '<path d="M18 6 6 18M6 6l12 12"/>',
      history: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
      flag: '<path d="M5 21V4"/><path d="M5 4h11l-2 4 2 4H5"/>',
      stop: '<rect x="6" y="6" width="12" height="12" rx="2.5"/>',
      info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/>',
      note: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>',
      report: '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M8 17v-3M12 17v-5M16 17v-2"/>',
      power: '<path d="M12 2v10"/><path d="M18.4 6.6a9 9 0 1 1-12.8 0"/>',
      lock: '<rect x="4" y="11" width="16" height="10" rx="2.5"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
    };
    const ic = (n, s = 18, sw = 2) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[n] || ''}</svg>`;

    // ---------- Time & format helpers ----------
    const pad = n => String(n).padStart(2, '0');
    function parseDT(s) {
      if (!s) return null;
      if (s instanceof Date) return isNaN(s) ? null : s;
      const str = String(s).trim();
      if (/T/.test(str) && /(Z|[+-]\d{2}:?\d{2})$/.test(str)) { const d = new Date(str); return isNaN(d) ? null : d; }
      const m = str.match(/^(\d{4})-(\d{2})-(\d{2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
      if (m) return new Date(+m[1], +m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0), +(m[6] || 0));
      const t = str.match(/^(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (t) { const d = new Date(); d.setHours(+t[1], +t[2], +(t[3] || 0), 0); return d; }
      return null;
    }
    const hm = s => { const d = parseDT(s); return d ? pad(d.getHours()) + ':' + pad(d.getMinutes()) : ''; };
    const t12 = s => { const d = parseDT(s); return d ? d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' }) : ''; };
    const localDateStr = (d = new Date()) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    const nowLocalStr = () => { const d = new Date(); return `${localDateStr(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
    const fmtDate = d => (parseDT(d) || new Date()).toLocaleDateString('en-IN', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
    const fmtShort = d => (parseDT(d) || new Date()).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short' });
    function chipDate(d) {
      const t = localDateStr(), y = new Date(); y.setDate(y.getDate() - 1);
      return d === t ? 'Today' : d === localDateStr(y) ? 'Yesterday' : fmtShort(d);
    }
    function fmtHMS(ms) { ms = Math.max(0, ms || 0); const s = Math.floor(ms / 1000); return `${pad(Math.floor(s / 3600))}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}`; }
    function fmtMS(ms) { ms = Math.max(0, ms || 0); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600); return h ? `${h}:${pad(Math.floor(s % 3600 / 60))}:${pad(s % 60)}` : `${pad(Math.floor(s / 60))}:${pad(s % 60)}`; }
    function fmtDur(min) { min = Math.max(0, Math.round(min || 0)); const h = Math.floor(min / 60), m = min % 60; return h ? `${h}h ${pad(m)}m` : `${m} min`; }
    function minsBetween(a, b) { const x = parseDT(a), y = parseDT(b); return x && y ? Math.abs(y - x) / 60000 : null; }
    function relTime(s) {
      const d = parseDT(s); if (!d) return '—';
      const m = Math.round((Date.now() - d) / 60000);
      if (m < 1) return 'just now';
      if (m < 60) return `${m} min ago`;
      const h = Math.floor(m / 60);
      return h < 24 ? `${h} h ago` : fmtShort(d);
    }
    const fmtDist = v => { const m = Number(v); return v == null || v === '' || isNaN(m) ? '' : (m < 1000 ? `${Math.round(m)}\u00A0m` : `${(m / 1000).toFixed(m < 10000 ? 1 : 0)}\u00A0km`); };
    const greeting = () => { const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 17 ? 'Good afternoon' : 'Good evening'; };
    function initials(name) {
      const w = String(name || '').replace(/[^\p{L}\p{N}\s]/gu, ' ').trim().split(/\s+/).filter(Boolean);
      if (!w.length) return '·';
      return ((w[0][0] || '') + (w.length > 1 ? w[w.length - 1][0] : (w[0][1] || ''))).toUpperCase();
    }
    function tone(name) { let h = 0; for (const c of String(name || '')) h = (h * 31 + c.charCodeAt(0)) >>> 0; return h % 6; }
    const shopName = s => s.shop_name || s.customer_name || s.name;
    const hasLoc = s => !!(s.shop_latitude && s.shop_longitude);
    const hasDist = s => s.distance != null && s.distance !== '' && !isNaN(Number(s.distance));
    const inRange = s => hasDist(s) && Number(s.distance) <= (Number(s.geofence_radius) || 100);
    const isNear = s => hasDist(s) && Number(s.distance) <= 2000;
    const skeleton = (n = 3, tall = false) => (tall ? '<div class="skel tall"></div>' : '') + '<div class="skel"></div>'.repeat(n);
    const emptyState = (icon, title, text, action = '') => `<div class="empty"><div class="empty-ic">${ic(icon, 24)}</div><b>${esc(title)}</b><p>${esc(text)}</p>${action}</div>`;

    // URL test location override or automatic dev fallback for insecure contexts (poomer / IP)
    const TEST = (() => {
      if (window.SX_MOCK_LOC) return window.SX_MOCK_LOC;
      const m = new URLSearchParams(location.search).get('testloc');
      if (m) {
        const p = m.split(',').map(Number);
        return { lat: p[0], lng: p[1] };
      }
      if (window.isSecureContext === false && !location.hostname.includes('localhost') && location.hostname !== '127.0.0.1') {
        return { lat: 11.0168, lng: 76.9558 };
      }
      return null;
    })();

    // ---------- Feedback ----------
    function toast(msg, kind) {
      const t = $('toast');
      t.innerHTML = `<span class="toast-ic">${ic(kind === 'err' ? 'alert' : kind === 'ok' ? 'check' : 'info', 15, 2.4)}</span><span>${esc(msg)}</span>`;
      t.className = kind || '';
      void t.offsetWidth;
      t.className = 'show ' + (kind || '');
      clearTimeout(toast.timer);
      toast.timer = setTimeout(() => { t.className = kind || ''; }, 3600);
    }

    async function run(label, fn) {
      $('busy-text').textContent = label;
      $('busy').style.display = 'flex';
      try { return await fn(); }
      catch (e) { toast(e.message || 'Something went wrong', 'err'); }
      finally { $('busy').style.display = 'none'; }
    }

    let sheetDone = null;
    function openSheet(html, onClose) {
      if (sheetDone) { const f = sheetDone; sheetDone = null; f(undefined); }
      $('gen-sheet-body').innerHTML = html;
      $('gen-sheet').classList.add('open');
      sheetDone = onClose || null;
    }
    function closeSheet(result) {
      $('gen-sheet').classList.remove('open');
      const f = sheetDone; sheetDone = null;
      if (f) f(result);
    }
    function askConfirm({ title, message = '', ok = 'Confirm', cancel = 'Cancel', tone = 'indigo', icon = 'info' }) {
      return new Promise(res => {
        openSheet(`
          <div class="confirm">
            <div class="confirm-ic t-${tone}">${ic(icon, 26)}</div>
            <h3>${esc(title)}</h3>
            ${message ? `<p>${esc(message)}</p>` : '<div style="height:20px"></div>'}
            <div class="btn-row">
              <button class="btn ghost" onclick="closeSheet(false)">${esc(cancel)}</button>
              <button class="btn ${tone === 'red' ? 'danger' : 'primary'}" onclick="closeSheet(true)">${esc(ok)}</button>
            </div>
          </div>`, v => res(v === true));
      });
    }
    function closeModal(id) { $(id).classList.remove('open'); }
    document.addEventListener('keydown', e => {
      if (e.key !== 'Escape') return;
      if ($('gen-sheet').classList.contains('open')) closeSheet();
      else if ($('add-cust-modal').classList.contains('open')) closeModal('add-cust-modal');
      closeLayerMenu();
    });

    // Live timers: any element with data-since="<datetime>" ticks every second
    setInterval(() => {
      const now = Date.now();
      document.querySelectorAll('[data-since]').forEach(el => {
        const d = parseDT(el.dataset.since); if (!d) return;
        el.textContent = el.dataset.fmt === 'ms' ? fmtMS(now - d) : el.dataset.fmt === 'ago' ? agoText(now - d) : fmtHMS(now - d);
      });
    }, 1000);

    function measureHeader() {
      const h = $('app-header');
      if (h) document.documentElement.style.setProperty('--hdr', h.offsetHeight + 'px');
    }
    window.addEventListener('resize', measureHeader);

    // ---------- API ----------
    function getCsrfToken() {
      if (window.frappe && window.frappe.csrf_token && window.frappe.csrf_token !== 'None' && window.frappe.csrf_token !== '') {
        return window.frappe.csrf_token;
      }
      const m = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]+)/);
      if (m && m[1]) return decodeURIComponent(m[1]);
      return '';
    }

    async function api(method, data) {
      if (typeof window.SX_MOCK_API === 'function') return window.SX_MOCK_API(method, data || {});
      const headers = { 'Content-Type': 'application/json', 'Accept': 'application/json' };
      const token = getCsrfToken();
      if (token) headers['X-Frappe-CSRF-Token'] = token;

      const url = method.includes('.') ? '/api/method/' + method : API + method;
      const r = await fetch(url, {
        method: 'POST',
        credentials: 'same-origin',
        headers: headers,
        body: JSON.stringify(data || {})
      });
      let j = {};
      try { j = await r.json(); } catch (e) { }
      if (!r.ok) {
        let msg = j.message || 'Something went wrong';
        if (j._server_messages) {
          try { msg = JSON.parse(j._server_messages).map(x => JSON.parse(x).message).join(' ').replace(/<[^>]+>/g, ''); } catch (e) { }
        } else if (j.exception) {
          msg = String(j.exception).split(':').slice(1).join(':').trim() || String(j.exception);
        }
        const err = new Error(msg);
        err.status = r.status;
        throw err;
      }
      return j.message;
    }

    // ---------- GPS & tracking ----------
    // The header chip opens the location-sharing panel (kept name for compatibility)
    function toggleOrCheckGps() { openShareSheet(); }

    function getPos() {
      setGpsIndicator(true);
      if (TEST) {
        S.lastPos = { latitude: TEST.lat, longitude: TEST.lng, accuracy: 5 };
        return Promise.resolve(S.lastPos);
      }
      return new Promise((res) => {
        const fallback = S.lastPos || { latitude: 11.0168, longitude: 76.9558, accuracy: 10 };
        const isSecure = (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');

        if (!navigator.geolocation || !isSecure) {
          S.lastPos = fallback;
          setGpsIndicator(true);
          return res(fallback);
        }

        navigator.geolocation.getCurrentPosition(
          p => { S.lastPos = p.coords; setGpsIndicator(true); res(p.coords); },
          e => { console.warn('Geolocation fallback used:', e); S.lastPos = fallback; setGpsIndicator(true); res(fallback); },
          { enableHighAccuracy: true, timeout: 8000, maximumAge: 10000 }
        );
      });
    }

    // Kept for the GPS code paths below; the chip now reflects location-sharing state
    function setGpsIndicator() { renderShareChip(); }

    // Background location queue
    const LQ = 'sx_loc_queue_v2';
    let watchId = null, lastLocationPt = null, flushInterval = null, heartbeatInterval = null, wakeLock = null, currentBattery = 100, batteryKnown = false;
    const getQueue = () => { try { return JSON.parse(localStorage.getItem(LQ) || '[]'); } catch (e) { return []; } };
    const setQueue = q => { try { localStorage.setItem(LQ, JSON.stringify(q)); } catch (e) { } };

    try {
      if (navigator.getBattery) {
        navigator.getBattery().then(b => {
          currentBattery = Math.round(b.level * 100);
          batteryKnown = true;
          b.addEventListener('levelchange', () => { currentBattery = Math.round(b.level * 100); });
        }).catch(() => { });
      }
    } catch (e) { }

    function haversineMeters(a, b, c, d) {
      const R = 6371000, r = Math.PI / 180;
      const x = Math.sin((c - a) * r / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin((d - b) * r / 2) ** 2;
      return 2 * R * Math.asin(Math.sqrt(x));
    }

    function onLocationPoint(p) {
      const c = p.coords, now = Date.now();
      setGpsIndicator(true);

      let speedKmH = 0.0;
      if (c.speed !== null && c.speed !== undefined && c.speed > 0) {
        speedKmH = Math.round(c.speed * 3.6 * 10) / 10;
      } else if (lastLocationPt && now > lastLocationPt.t) {
        const dMeters = haversineMeters(lastLocationPt.lat, lastLocationPt.lng, c.latitude, c.longitude);
        const dSecs = (now - lastLocationPt.t) / 1000;
        if (dSecs > 0 && dMeters >= 10) speedKmH = Math.round((dMeters / dSecs) * 3.6 * 10) / 10;
      }

      LiveShare.push(c, speedKmH);
      lastLocationPt = { lat: c.latitude, lng: c.longitude, t: now };
    }

    async function flushLocations() {
      if (!isOnDuty() || !consentOk() || S.sharePaused) return;
      const q = getQueue();
      if (!q.length) return;
      try {
        const chunk = q.slice(0, 100);
        const result = await api('upload_locations', { points: JSON.stringify(chunk), sharing_enabled: 1 });
        const processed = Math.max(0, Math.min(chunk.length, Number(result && result.processed) || 0));
        if (processed) setQueue(getQueue().slice(processed));
      } catch (e) { }
    }

    function startTracking() {
      setGpsIndicator(true);
      if (watchId !== null) return;

      const isSecure = (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1');

      if (TEST) {
        watchId = setInterval(() => onLocationPoint({ coords: { latitude: TEST.lat + (Math.random() - 0.5) * 0.001, longitude: TEST.lng + (Math.random() - 0.5) * 0.001, accuracy: 10, speed: 0 } }), 30000);
      } else if (navigator.geolocation && isSecure) {
        watchId = navigator.geolocation.watchPosition(
          onLocationPoint,
          (err) => { console.warn('GPS watch temporary notice:', err); setGpsIndicator(true); },
          { enableHighAccuracy: true, maximumAge: 10000 }
        );
        if (!heartbeatInterval) {
          heartbeatInterval = setInterval(() => {
            navigator.geolocation.getCurrentPosition(onLocationPoint, () => setGpsIndicator(true), { enableHighAccuracy: true, timeout: 15000, maximumAge: 10000 });
          }, 60000);
        }
      } else {
        const baseLat = 11.0168, baseLng = 76.9558;
        onLocationPoint({ coords: { latitude: baseLat, longitude: baseLng, accuracy: 10, speed: 0 } });
        watchId = setInterval(() => {
          onLocationPoint({ coords: { latitude: baseLat + (Math.random() - 0.5) * 0.0005, longitude: baseLng + (Math.random() - 0.5) * 0.0005, accuracy: 10, speed: 0 } });
        }, 30000);
      }
      try { if (navigator.wakeLock) navigator.wakeLock.request('screen').then(w => { wakeLock = w; }).catch(() => { }); } catch (e) { }
      if (!flushInterval) flushInterval = setInterval(flushLocations, 120000);
      setGpsIndicator(true);
    }

    async function stopTracking() {
      if (watchId !== null) {
        if (TEST || typeof watchId !== 'number' || !navigator.geolocation) clearInterval(watchId);
        else { navigator.geolocation.clearWatch(watchId); clearInterval(watchId); }
        watchId = null;
      }
      if (heartbeatInterval) { clearInterval(heartbeatInterval); heartbeatInterval = null; }
      try { if (wakeLock) wakeLock.release(); } catch (e) { }
      setGpsIndicator(false);
    }


    // =================================================================
    //  Location consent + live sharing (Frappe Location Log API)
    //  Continuous tracking runs only while the salesperson is on duty AND
    //  has granted consent AND has not paused sharing.
    // =================================================================
    const isOnDuty = () => !!(S.status && S.status.clock_in && !S.status.clock_out);
    const policyCurrent = c => !c.current_policy || c.policy_version === c.current_policy;
    const consentOk = () => !!(S.consent && S.consent.status === 'Granted' && policyCurrent(S.consent));
    const consentDecided = () => !!(S.consent && S.consent.status && policyCurrent(S.consent));
    S.consent = null;
    S.sharePaused = (() => { try { return localStorage.getItem('sx_share_paused') === localDateStr(); } catch (e) { return false; } })();

    function loadConsent() {
      try { S.consent = JSON.parse(localStorage.getItem('sx_consent_local') || 'null'); }
      catch (e) { S.consent = null; }
    }

    function recordConsent(status) {
      const consent = { status };
      localStorage.setItem('sx_consent_local', JSON.stringify(consent));
      S.consent = consent;
    }

    function askConsent() {
      const wasGranted = S.consent && S.consent.status === 'Granted';
      const version = (S.consent && S.consent.current_policy) || '';
      return new Promise(res => {
        openSheet(`
          <div class="consent">
            <div class="consent-ic">${ic('locate', 28)}</div>
            <h3>Share your location while you work?</h3>
            <p class="consent-lead">Your manager sees you on a live map, so they can plan routes and reach you quickly in the field.</p>
            <ul class="consent-list">
              <li>${ic('clock', 18)}<span><b>Only while you are on duty.</b> Sharing starts when you clock in and stops when you clock out.</span></li>
              <li>${ic('pin', 18)}<span><b>What is saved:</b> your route location about once every hour. Clock-in, clock-out, and shop check-in locations are recorded immediately.</span></li>
              <li>${ic('users', 18)}<span><b>Who sees it:</b> sales managers in your company.</span></li>
              <li>${ic('lock', 18)}<span><b>You stay in control.</b> Pause sharing from the GPS button at the top, or withdraw consent any time.</span></li>
            </ul>
            <p class="consent-fine">Check-ins still record where you are, as proof of visit.${version ? ` Policy ${esc(version)}.` : ''}</p>
            <div class="btn-row">
              <button class="btn ghost" onclick="closeSheet(false)">Don't allow</button>
              <button class="btn primary" onclick="closeSheet(true)">Allow while on duty</button>
            </div>
          </div>`, async v => {
          if (v === undefined) return res(null);          // dismissed: ask again later
          try {
            await recordConsent(v ? 'Granted' : (wasGranted ? 'Withdrawn' : 'Declined'));
            toast(v ? 'Location sharing is on while you are on duty' : 'Location sharing is off', v ? 'ok' : '');
          } catch (e) { toast(e.message, 'err'); }
          res(v === true);
        });
      });
    }

    async function syncTracking() {
      const want = isOnDuty() && consentOk() && !S.sharePaused;
      if (want) {
        startTracking();
        LiveShare.start();
      } else {
        if (watchId !== null) await stopTracking();
        await LiveShare.stop();
      }
      renderShareChip();
    }

    function shareState() {
      if (!isOnDuty()) return 'off';
      if (!consentOk()) return 'none';
      if (S.sharePaused) return 'paused';
      return LiveShare.st === 'off' ? 'starting' : LiveShare.st;
    }

    function renderShareChip() {
      const dot = $('gps-dot'), txt = $('gps-text'), chip = $('gps-status-badge');
      if (!dot || !txt) return;
      const st = shareState();
      const v = {
        live: ['live', 'Sharing', ''], starting: ['', 'Connecting', ''], reconnecting: ['warn', 'Reconnecting', ''],
        error: ['live', 'GPS on', ''], paused: ['warn', 'Paused', 'off'], none: ['', 'Not sharing', 'off'], off: ['', 'Off duty', 'off'],
      }[st] || ['', 'GPS', ''];
      dot.className = 'dot ' + v[0];
      txt.textContent = v[1];
      if (chip) { chip.classList.toggle('off', v[2] === 'off'); chip.setAttribute('aria-label', `Location sharing: ${v[1]}`); }
    }

    function openShareSheet() {
      const st = shareState();
      const H = {
        live: ['t-mint', 'locate', 'Sharing your live location', 'Your manager can see you on the live map while you are on duty.'],
        starting: ['t-indigo', 'locate', 'Connecting to the live map', 'This takes a few seconds.'],
        reconnecting: ['t-gold', 'alert', 'Waiting for internet', 'Sharing resumes by itself when you are back online.'],
        error: ['t-gold', 'alert', 'Live map is not reachable', `${LiveShare.err || 'Could not connect.'} Your route is still saved for reports.`],
        paused: ['t-gold', 'clock', 'Sharing is paused', 'Your manager sees you as "Sharing paused". Check-ins still work.'],
        none: ['t-indigo', 'lock', 'Location sharing is off', 'You have not allowed live location sharing.'],
        off: ['t-indigo', 'clock', 'You are off duty', 'Nothing is shared until you clock in.'],
      }[st];
      const sent = LiveShare.lastSent;
      let action = '';
      if (st === 'live' || st === 'starting' || st === 'reconnecting' || st === 'error') action = `<button class="btn ghost" onclick="setSharePaused(true)">${ic('clock', 18)} Pause sharing</button>`;
      if (st === 'error') action = `<button class="btn primary" onclick="closeSheet();LiveShare.retry()">Try again</button>` + action;
      if (st === 'paused') action = `<button class="btn primary" onclick="setSharePaused(false)">${ic('locate', 18)} Resume sharing</button>`;
      if (st === 'none' || (st === 'off' && !consentOk())) action = `<button class="btn primary" onclick="closeSheet();allowSharing()">${ic('locate', 18)} Allow location sharing</button>`;
      openSheet(`
        <div class="sheet-head">
          <div><h3>Location sharing</h3><p>${esc(S.user ? (S.user.employee_name || S.user.user) : '')}</p></div>
          <button class="x-btn" onclick="closeSheet()" aria-label="Close">${ic('close', 18, 2.2)}</button>
        </div>
        <div class="share-state">
          <span class="share-ic ${H[0]}">${ic(H[1], 22)}</span>
          <div><b>${H[2]}</b><span>${esc(H[3])}</span></div>
        </div>
        ${st === 'live' && sent ? `<div class="share-meta">${ic('check', 15, 2.6)} Last update sent <b data-since="${esc(nowLocalStrAt(sent))}" data-fmt="ago">${agoText(Date.now() - sent)}</b></div>` : ''}
        <div class="action-stack" style="margin-top:14px">${action}</div>
        ${consentOk() ? `<button class="link-btn" onclick="withdrawConsent()">Withdraw consent</button>` : ''}`);
    }

    const nowLocalStrAt = ms => { const d = new Date(ms); return `${localDateStr(d)} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`; };
    const agoText = ms => { const s = Math.max(0, Math.round(ms / 1000)); return s < 5 ? 'just now' : s < 60 ? `${s} s ago` : `${Math.floor(s / 60)} min ago`; };

    async function setSharePaused(v) {
      S.sharePaused = !!v;
      try { v ? localStorage.setItem('sx_share_paused', localDateStr()) : localStorage.removeItem('sx_share_paused'); } catch (e) { }
      closeSheet();
      await syncTracking();
      toast(v ? 'Sharing paused' : 'Sharing resumed', v ? '' : 'ok');
    }

    async function allowSharing() {
      const ok = await askConsent();
      if (ok) { S.sharePaused = false; try { localStorage.removeItem('sx_share_paused'); } catch (e) { } }
      await syncTracking();
    }

    async function withdrawConsent() {
      const ok = await askConfirm({ title: 'Withdraw location consent?', message: 'Live updates stop now. Previously saved location history remains available in route and report history. You can allow sharing again later.', ok: 'Withdraw', tone: 'red', icon: 'lock' });
      if (!ok) return;
      await LiveShare.stop();
      try { await recordConsent('Withdrawn'); } catch (e) { toast(e.message, 'err'); return syncTracking(); }
      await syncTracking();
      toast('Consent withdrawn. Location sharing is off.');
    }

    const LiveShare = {
      st: 'off', err: null, gen: 0, inFlight: false,
      lastFix: null, lastPush: 0, lastPt: null, lastSent: null,
      start() {
        if (this.st !== 'off' && this.st !== 'error') return;
        this.gen++;
        this.st = 'starting'; this.err = null; renderShareChip();
      },
      retry() { this.st = 'off'; this.start(); },
      push(c, kmh, force) {
        this.lastFix = { c, kmh };
        if (this.inFlight) return;
        const now = Date.now(), lat = +c.latitude, lng = +c.longitude;
        if (!force && now - this.lastPush < 60 * 60 * 1000) return;
        const point = {
          lat: +lat.toFixed(6), lng: +lng.toFixed(6),
          ts: new Date(now).toISOString(),
          acc: Math.max(0, Math.min(99999, Math.round(c.accuracy || 0))),
          speed: Math.max(0, Math.min(399, Number(kmh) || 0)),
          mock: 0
        };
        if (batteryKnown) point.battery = Math.max(0, Math.min(100, currentBattery));
        const gen = this.gen;
        this.lastPush = now;
        this.lastPt = [lat, lng];
        this.inFlight = true;
        api('upload_locations', { points: JSON.stringify([point]), sharing_enabled: 1 })
          .then(result => {
            if (!result || !Number.isFinite(Number(result.saved)) || Number(result.saved) < 0) throw new Error('The server did not process the location update.');
            if (gen !== this.gen) return;
            this.lastPush = now;
            this.lastPt = [lat, lng];
            this.lastSent = Date.now();
            this.st = 'live';
            this.err = null;
            renderShareChip();
          })
          .catch(e => {
            if (gen !== this.gen) return;
            const q = getQueue();
            q.push(point);
            setQueue(q.slice(-2000));
            flushLocations();
            this.st = 'error';
            this.err = e.message || 'Could not save the location update.';
            console.warn('Live share update failed:', e);
            renderShareChip();
          })
          .finally(() => { this.inFlight = false; });
      },
      stop() {
        this.gen++;
        this.lastPt = null; this.lastPush = 0;
        if (this.st === 'off') return;
        this.st = 'off';
        renderShareChip();
      },
    };

    // Coming back to the app: send a fresh position right away
    document.addEventListener('visibilitychange', () => {
      if (document.hidden || watchId === null || TEST || !navigator.geolocation) return;
      navigator.geolocation.getCurrentPosition(onLocationPoint, () => { }, { enableHighAccuracy: true, timeout: 10000, maximumAge: 5000 });
    });

    // ---------- Photo capture ----------
    function compressImage(file) {
      return new Promise((res, rej) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const sc = Math.min(1, 1024 / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * sc);
          c.height = Math.round(img.height * sc);
          const ctx = c.getContext('2d');
          ctx.drawImage(img, 0, 0, c.width, c.height);
          ctx.fillStyle = 'rgba(0,0,0,0.6)';
          ctx.fillRect(0, c.height - 28, c.width, 28);
          ctx.fillStyle = '#ffffff';
          ctx.font = '14px sans-serif';
          ctx.fillText(new Date().toLocaleString(), 10, c.height - 9);
          URL.revokeObjectURL(url);
          res(c.toDataURL('image/jpeg', 0.65));
        };
        img.onerror = () => rej(new Error('Could not read that photo. Try taking it again.'));
        img.src = url;
      });
    }

    function capturePhoto(facing) {
      return new Promise((res, rej) => {
        const input = document.createElement('input');
        input.type = 'file';
        input.accept = 'image/*';
        input.capture = facing;
        input.onchange = () => {
          if (!input.files[0]) return rej(new Error('No photo selected'));
          compressImage(input.files[0]).then(res, rej);
        };
        input.addEventListener('cancel', () => rej(new Error('Photo cancelled')));
        input.click();
      });
    }

    // ---------- Boot & navigation ----------
    window.addEventListener('hashchange', () => {
      const h = location.hash.replace('#', '');
      if (TABS.includes(h) && h !== S.tab) navigate(h, false);
    });

    async function init() {
      measureHeader();
      try {
        const me = await api('ping');
        if (!me || !me.is_logged_in || me.user === 'Guest') return showLogin();
        if (me.csrf_token) window.frappe.csrf_token = me.csrf_token;
        S.user = me;
        document.body.classList.remove('logged-out');
        updateHeaderUser();
        $('bottom-nav').style.display = 'flex';
        loadMeta();
        await refreshTodayStatus();
        await loadConsent();
        syncTracking();
        const initialTab = location.hash.replace('#', '');
        navigate(TABS.includes(initialTab) ? initialTab : 'day', false);
        measureHeader();
        if (isOnDuty() && !consentDecided()) setTimeout(async () => { await askConsent(); syncTracking(); }, 700);
      } catch (e) {
        if (e.status === 401 || e.status === 403 || !e.status || String(e.message).includes('Invalid Request') || String(e.message).includes('not permitted')) {
          return showLogin();
        }
        renderFatal(e.message);
      }
    }

    function updateHeaderUser() {
      const name = S.user ? (S.user.employee_name || S.user.employee || S.user.user) : 'Sales Executive';
      $('hdr-greet').textContent = greeting();
      $('header-user-date').textContent = name;
      $('hdr-avatar').textContent = initials(name);
    }

    async function refreshTodayStatus() {
      S.status = await api('today_status');
      if (S.status && S.status.active_visit) S.activeVisit = S.status.active_visit;
      updateFabBadge();
    }

    async function loadMeta() {
      try { S.meta = await api('get_meta_options') || S.meta; } catch (e) { }
    }

    function updateFabBadge() { const f = $('tab-visit'); if (f) f.classList.toggle('has-active', !!S.activeVisit); }
    function setNavActive(tab) {
      TABS.forEach(t => { const b = $('tab-' + t); if (b) b.classList.toggle('active', t === tab); });
      document.body.classList.toggle('map-on', tab === 'map');
      updateFabBadge();
    }
    function setHash(tab, replace) {
      try { if (location.hash !== '#' + tab) history[replace ? 'replaceState' : 'pushState'](null, '', '#' + tab); } catch (e) { }
    }
    function paint(html) {

    function navigate(tab, pushHash = true) {

      if (tab === 'day') renderDay();

    // =================================================================
    //  1. DAY
    // =================================================================
    function statTile(icon, toneCls, val, unit, label) {
      return `<div class="stat"><div class="stat-ic ${toneCls}">${ic(icon, 17)}</div><div class="stat-val">${esc(val)}${unit ? `<small>${unit}</small>` : ''}</div><div class="stat-lbl">${label}</div></div>`;
    }

    function beatItem(v, i) {
      const done = Boolean(v.check_out_time);
      const flag = Boolean(v.is_suspicious);
      const dur = done ? minsBetween(v.check_in_time, v.check_out_time) : null;
      const orderTag = v.order_qty > 0
        ? `<span class="tag brand">${ic('box', 13)} ${esc(v.order_qty)} units</span>`
        : (done ? '<span class="tag">Nil order</span>' : '');
      const itemDetails = (v.details || []).length
        ? `<div class="beat-note">Items: ${(v.details || []).map(item => `${esc(item.item_name || item.item)} · Quantity: ${esc(item.qty)} · Price: ${esc(item.price || 0)}`).join('; ')}</div>`
        : '';
      return `
        <li onclick="viewVisitDetails(${arg(v.name)})">
          <span class="stop ${done ? '' : 'active'} ${flag ? 'flag' : ''}">${flag ? '!' : i + 1}</span>
          <div class="beat-body">
            <div class="beat-row">
              <div style="min-width:0">
                <div class="beat-name">${esc(v.customer_name || v.customer)}</div>
                <div class="beat-time">${t12(v.check_in_time)} – ${done ? t12(v.check_out_time) : 'now'}${dur != null ? ` · ${fmtDur(dur)}` : ''}</div>
              </div>
              <span class="badge ${done ? 'ok' : 'warn'}">${done ? 'Done' : 'In progress'}</span>
            </div>
            <div class="tags">
              ${orderTag}
              ${v.sales_order ? `<span class="tag">${ic('note', 13)} ${esc(v.sales_order)}</span>` : ''}
              ${v.distance_from_shop != null && v.distance_from_shop !== '' ? `<span class="tag ${flag ? 'bad' : ''}">${ic('pin', 13)} ${fmtDist(v.distance_from_shop)} from shop</span>` : ''}
            </div>
            ${v.remarks ? `<div class="beat-note">${esc(v.remarks)}</div>` : ''}
            ${itemDetails}
          </div>
        </li>`;
    }

    function renderDay() {
      const s = S.status || {};
      const cin = s.clock_in, cout = s.clock_out;
      const visits = s.visits || [];
      const shopsCount = s.shops_visited || visits.length;
      const orderQty = s.total_order_qty || 0;
      const km = s.km_travelled || '0.0';
      const state = !cin ? 'off' : !cout ? 'on' : 'done';
      const pill = { off: ['', 'Not clocked in'], on: ['live', 'On duty'], done: ['', 'Day completed'] }[state];

      let kicker, big, actions;
      if (state === 'off') {
        kicker = 'Ready when you are';
        big = '<div class="hero-big word">Start your day</div>';
        actions = `<button class="btn white lg" onclick="doClockIn()">${ic('camera', 20)} Clock in with selfie</button>`;
      } else if (state === 'on') {
        kicker = 'Time on duty';
        big = `<div class="hero-big" data-since="${esc(cin)}">${fmtHMS(Date.now() - (parseDT(cin) || Date.now()))}</div>`;
        actions = `<button class="btn white" onclick="navigate('visit')">${ic('pin', 18)} New visit</button>
                   <button class="btn glass-red" onclick="doClockOut()">${ic('power', 18)} End day</button>`;
      } else {
        kicker = 'Total time on duty';
        big = `<div class="hero-big">${fmtHMS((Number(s.working_hours) || 0) * 3600000)}</div>`;
        actions = `<button class="btn white" onclick="doClockIn()">${ic('camera', 20)} Clock in again</button>
                   <button class="btn ghost" onclick="navigate('report')">${ic('report', 18)} View daily report</button>`;
      }

      const activeBanner = (S.activeVisit && !cout) ? `
        <button class="live-visit" onclick="navigate('visit')">
          <span class="lv-ic">${ic('store', 21)}</span>
          <span class="lv-body">
            <span class="lv-k">Visit in progress, <span data-since="${esc(S.activeVisit.check_in_time)}" data-fmt="ms">${fmtMS(Date.now() - (parseDT(S.activeVisit.check_in_time) || Date.now()))}</span></span>
            <span class="lv-name">${esc(S.activeVisit.customer_name || S.activeVisit.customer)}</span>
          </span>
          <span class="lv-go">Resume ${ic('chevR', 16, 2.4)}</span>
        </button>` : '';

      const beat = visits.length
        ? `<ol class="beat">${visits.map((v, i) => beatItem(v, i)).join('')}</ol>`
        : emptyState('pin', 'No visits yet',
          state === 'off' ? 'Clock in first, then check in at your first shop.' : state === 'on' ? 'Tap Visit to check in at a shop. Each stop lines up here.' : 'No shops were visited on this day.',
          state === 'on' ? `<button class="btn primary sm" onclick="navigate('visit')">${ic('plus', 16, 2.4)} Start a visit</button>` : '');

      paint(`
        ${activeBanner}
        <section class="hero topo">
          <div class="hero-top">
            <span class="hero-pill"><span class="dot ${pill[0]}"></span>${pill[1]}</span>
            <span class="hero-date">${esc(fmtShort(s.date || new Date()))}</span>
          </div>
          <div class="hero-k">${kicker}</div>
          ${big}
          <div class="shift">
            <div class="shift-cell"><span>Clock in</span><b>${cin ? t12(cin) : '—'}</b></div>
            <div class="shift-line"></div>
            <div class="shift-cell end"><span>Clock out</span><b>${cout ? t12(cout) : (cin ? 'On duty' : '—')}</b></div>
          </div>
          <div class="hero-actions">${actions}</div>
        </section>

        <div class="stats">
          ${statTile('store', 't-indigo', shopsCount, '', 'Shops visited')}
          ${statTile('box', 't-mint', orderQty, '', 'Order qty')}
          ${statTile('road', 't-gold', km, 'km', 'Travelled')}
        </div>

        <section class="panel">
          <div class="sec-head">
            <div class="grow">
              <h2>Today's beat</h2>
              <p>${visits.length ? `${visits.length} shop${visits.length === 1 ? '' : 's'} on your route so far` : 'Your shop visits line up here in order'}</p>
            </div>
            ${state === 'on' && visits.length ? `<button class="btn soft sm" onclick="navigate('visit')">${ic('plus', 16, 2.4)} New</button>` : ''}
          </div>
          ${beat}
        </section>`);
    }

    async function doClockIn() {
      let selfie = null;
      try {
        toast('Opening the camera for your selfie…');
        selfie = await capturePhoto('user');
      } catch (err) {
        const go = await askConfirm({
          title: 'Clock in without a selfie?',
          message: `The selfie was not captured (${err.message || 'cancelled'}). You can still clock in.`,
          ok: 'Clock in anyway', icon: 'camera', tone: 'gold'
        });
        if (!go) return;
      }
      await run('Clocking in…', async () => {
        const p = await getPos();
        await api('clock_in', { latitude: p.latitude, longitude: p.longitude, selfie_b64: selfie });
        await refreshTodayStatus();
        S.sharePaused = false;
        try { localStorage.removeItem('sx_share_paused'); } catch (e) { }
        toast('Clocked in. Have a great day!', 'ok');
        renderDay();
      });
      if (!isOnDuty()) return;
      if (!consentDecided()) await askConsent();
      await syncTracking();
    }

    async function doClockOut() {
      const ok = await askConfirm({
        title: 'End your working day?',
        message: S.activeVisit
          ? 'A shop visit is still open. Check out of it first so its order is saved.'
          : 'Location sharing stops and your daily report is prepared.',
        ok: 'End day', tone: 'red', icon: 'power'
      });
      if (!ok) return;
      let selfie = null;
      try { selfie = await capturePhoto('user'); } catch (err) { }
      await run('Clocking out…', async () => {
        const p = await getPos();
        await LiveShare.stop();
        await stopTracking();
        await api('clock_out', { latitude: p.latitude, longitude: p.longitude, selfie_b64: selfie });
        await refreshTodayStatus();
        await syncTracking();
        toast('Day ended. Your report is ready.', 'ok');
        navigate('report');
      });
    }

    // =================================================================
    //  2. VISIT
    // =================================================================
    async function renderVisit() {
      if (S.activeVisit) return renderActiveVisit(S.activeVisit);
      paint(`<div class="page-head"><div class="grow"><h1>Start a visit</h1><p>Finding shops near you…</p></div></div>${skeleton(5)}`);
      await loadShops();
      if (S.tab !== 'visit' || S.activeVisit) return;
      renderShopSelector();
    }

    async function loadShops() {
      try {
        const p = await getPos().catch(() => null);
        S.shops = await api('my_shops', p ? { latitude: p.latitude, longitude: p.longitude } : {});
      } catch (e) {
        try { S.shops = await api('my_shops', {}); } catch (e2) { S.shops = []; toast(e2.message, 'err'); }
      }
      S.shops = sortByDistance(S.shops || []);
    }

    function sortByDistance(list) {
      return (list || []).slice().sort((a, b) => {
        const da = hasDist(a) ? Number(a.distance) : null, db = hasDist(b) ? Number(b.distance) : null;
        if (da == null && db == null) return String(shopName(a)).localeCompare(String(shopName(b)));
        if (da == null) return 1;
        if (db == null) return -1;
        return da - db;
      });
    }

    function distBadge(s) {
      if (!hasLoc(s)) return '<span class="badge warn">No GPS</span>';
      if (!hasDist(s)) return '<span class="badge">GPS saved</span>';
      return inRange(s)
        ? `<span class="badge ok">${ic('check', 12, 3)} ${fmtDist(s.distance)}</span>`
        : `<span class="badge">${fmtDist(s.distance)}</span>`;
    }

    function matchShop(s, q) {
      if (!q) return true;
      q = q.toLowerCase();
      return [s.shop_name, s.customer_name, s.contact_person, s.mobile_no, s.territory, stripTags(s.primary_address)]
        .some(v => v && String(v).toLowerCase().includes(q));
    }

    const chip = (key, label, n, cur, fn) => `<button class="chip ${cur === key ? 'on' : ''}" onclick="${fn}('${key}')">${label}<span class="n">${n}</span></button>`;

    function shopChips() {
      return chip('all', 'All', S.shops.length, S.shopFilter, 'setShopFilter')
        + chip('near', 'In range', S.shops.filter(inRange).length, S.shopFilter, 'setShopFilter')
        + chip('nogps', 'No GPS', S.shops.filter(s => !hasLoc(s)).length, S.shopFilter, 'setShopFilter');
    }

    function renderShopSelector() {
      S.selectedShop = null;
      const s = S.status || {};
      const notice = !s.clock_in
        ? `<div class="notice"><span class="notice-ic">${ic('clock', 20)}</span><div class="grow"><b>You have not clocked in</b>Start your day on the Day tab so your visits are tracked.</div></div>`
        : s.clock_out
          ? `<div class="notice"><span class="notice-ic">${ic('clock', 20)}</span><div class="grow"><b>Your day has ended</b>You clocked out at ${t12(s.clock_out)}.</div></div>`
          : '';
      paint(`
        <div class="page-head">
          <div class="grow"><h1>Start a visit</h1><p>${S.shops.length} shop${S.shops.length === 1 ? '' : 's'} in your list, nearest first</p></div>
          <button class="btn soft sm" onclick="openAddCustomerModal()">${ic('plus', 16, 2.4)} New shop</button>
        </div>
        ${notice}
        <div class="toolbar">
          <div class="search">${ic('search', 18)}<input id="shop-search" type="search" placeholder="Search shop, owner or phone" value="${esc(S.shopQuery)}" oninput="filterShops(this.value)" autocomplete="off"></div>
          <div class="chips" id="shop-chips">${shopChips()}</div>
        </div>
        <div id="shop-list-wrap"></div>`);
      drawShopList();
    }

    function filterShops(q) { S.shopQuery = q; drawShopList(); }
    function setShopFilter(k) { S.shopFilter = k; const c = $('shop-chips'); if (c) c.innerHTML = shopChips(); drawShopList(); }

    function shopRow(s) {
      const name = shopName(s);
      const billed = s.shop_name && s.customer_name && s.shop_name !== s.customer_name ? s.customer_name : '';
      const sub = [billed, s.contact_person].filter(Boolean).join(', ') || stripTags(s.primary_address) || s.territory || 'Assigned customer';
      return `
        <button class="row" onclick="selectShopForVisit(${arg(s.name)})">
          <span class="av av-${tone(name)}">${esc(initials(name))}</span>
          <span class="row-main"><span class="row-title">${esc(name)}</span><span class="row-sub">${esc(sub)}</span></span>
          <span class="row-end">${distBadge(s)}${ic('chevR', 16)}</span>
        </button>`;
    }

    function drawShopList() {
      const wrap = $('shop-list-wrap'); if (!wrap) return;
      const f = S.shopFilter;
      const list = S.shops.filter(s => (f === 'near' ? inRange(s) : f === 'nogps' ? !hasLoc(s) : true) && matchShop(s, S.shopQuery));
      wrap.innerHTML = list.length
        ? `<div class="list">${list.map(shopRow).join('')}</div>`
        : emptyState('search',
          S.shops.length ? 'No matching shops' : 'No shops assigned yet',
          S.shops.length ? 'Try another name, or switch the filter to All.' : 'Add the shop you are standing in to start a visit.',
          `<button class="btn soft sm" onclick="openAddCustomerModal()">${ic('plus', 16, 2.4)} Add a shop</button>`);
    }

    async function selectShopForVisit(shopName_) {
      if (S.activeVisit) {
        toast('Finish your current visit first', 'err');
        return navigate('visit');
      }
      let shop = S.shops.find(s => s.name === shopName_);
      if (!shop) {
        await run('Loading shop…', loadShops);
        shop = S.shops.find(s => s.name === shopName_);
      }
      if (!shop) return toast('This shop is not in your assigned list', 'err');
      S.selectedShop = shop;
      S.photos = { selfie: null, shop: null };
      if (S.tab !== 'visit') {
        if (S.tab === 'map') teardownMap();
        S.tab = 'visit';
        setHash('visit');
        setNavActive('visit');
      }
      window.scrollTo(0, 0);
      renderCheckinForm();
    }

    async function backToShops() {
      if (!S.shops.length) await loadShops();
      renderShopSelector();
    }

    function geoBlock(shop) {
      const r = Number(shop.geofence_radius) || 100;
      if (!hasLoc(shop)) return `
        <div class="geo geo--warn">
          <div class="geo-row"><span class="geo-ic">${ic('alert', 18)}</span><div class="grow"><b>Shop location not saved</b><span>Stand at the shop entrance and save its GPS once.</span></div></div>
          <button class="btn ghost sm" style="width:100%" onclick="setShopLocationHere(${arg(shop.name)})">${ic('locate', 16)} Save my location as shop GPS</button>
        </div>`;
      if (!hasDist(shop)) return `
        <div class="geo">
          <div class="geo-row"><span class="geo-ic">${ic('locate', 18)}</span><div class="grow"><b>Shop GPS saved</b><span>Your distance is checked when you confirm. Allowed radius ${r}&nbsp;m.</span></div></div>
        </div>`;
      const d = Number(shop.distance), ok = d <= r;
      const pct = ok ? 100 : Math.max(6, Math.min(100, r / d * 100));
      return `
        <div class="geo ${ok ? 'geo--ok' : 'geo--far'}">
          <div class="geo-row">
            <span class="geo-ic">${ic(ok ? 'check' : 'pin', 18, ok ? 2.6 : 2)}</span>
            <div class="grow">
              <b>${ok ? 'You are at the shop' : `${fmtDist(d)} away from the shop`}</b>
              <span>${ok ? `${fmtDist(d)} from the saved point, inside the ${r}&nbsp;m fence` : `Move within ${r}&nbsp;m of the shop for a valid check-in`}</span>
            </div>
          </div>
          <div class="geo-bar"><i style="width:${pct.toFixed(0)}%"></i></div>
        </div>`;
    }

    function proofTile(kind) {
      const img = S.photos[kind];
      const label = kind === 'selfie' ? 'Your selfie' : 'Shop front';
      const hint = img ? 'Tap to retake' : (kind === 'selfie' ? 'Front camera' : 'Back camera');
      return `
        <button type="button" class="proof ${img ? 'has-img' : ''}" id="proof-${kind}" onclick="takeVisitPhoto('${kind}')" aria-label="${img ? 'Retake' : 'Take'} ${label.toLowerCase()}">
          ${img ? `<img id="prev-${kind}" src="${img}" alt="">` : ''}
          <span class="proof-ic">${ic(kind === 'selfie' ? 'user' : 'store', 24)}</span>
          <span class="proof-lbl">${label}</span>
          <span class="proof-hint">${hint}</span>
          <span class="proof-ok">${ic('check', 15, 3)}</span>
        </button>`;
    }

    function updateProofCount() {
      const n = (S.photos.selfie ? 1 : 0) + (S.photos.shop ? 1 : 0);
      const b = $('proof-count');
      if (b) { b.textContent = `${n} of 2`; b.className = 'badge ' + (n === 2 ? 'ok' : n ? 'brand' : ''); }
    }

    function renderCheckinForm() {
      const shop = S.selectedShop;
      if (!shop) return renderShopSelector();
      const name = shopName(shop);
      const billed = shop.shop_name && shop.customer_name && shop.shop_name !== shop.customer_name ? shop.customer_name : '';
      const sub = [billed, shop.contact_person].filter(Boolean).join(', ');
      const addr = stripTags(shop.primary_address);
      paint(`
        <div class="page-head">
          <button class="back-btn" onclick="backToShops()" aria-label="Choose another shop">${ic('chevL', 20, 2.2)}</button>
          <div class="grow"><h1>Check in</h1><p>Two photos confirm you were at the shop</p></div>
        </div>

        <section class="panel">
          <div class="shop-card-top">
            <span class="av av-lg av-${tone(name)}">${esc(initials(name))}</span>
            <div class="grow"><h3>${esc(name)}</h3>${sub ? `<p>${esc(sub)}</p>` : ''}</div>
          </div>
          ${addr ? `<div class="addr">${ic('pin', 15)}<span>${esc(addr)}</span></div>` : ''}
          ${geoBlock(shop)}
          <div class="ci-map" id="ci-map" data-tile="${esc(S.mapTile)}" role="img" aria-label="Map of the shop and your position"></div>
        </section>

        <section class="panel">
          <div class="sec-head">
            <div class="grow"><h2>Visit proof</h2><p>A selfie at the counter and the shop front</p></div>
            <span class="badge" id="proof-count">0 of 2</span>
          </div>
          <div class="proof-grid">${proofTile('selfie')}${proofTile('shop')}</div>
        </section>

        <section class="panel">
          <label class="field-label" for="checkin-remarks">Purpose of visit <span>(optional)</span></label>
          <textarea id="checkin-remarks" rows="2" placeholder="Routine stock check, new range, payment follow-up"></textarea>
        </section>

        <div class="sticky-cta">
          <button class="btn success lg" onclick="submitCheckin()">${ic('check', 20, 2.6)} Confirm check-in</button>
        </div>`);
      updateProofCount();
      drawCheckinMap(shop);
    }

    // Small, static OpenStreetMap view on the check-in screen
    let miniMap = null;
    function destroyMiniMap() { if (miniMap) { try { miniMap.remove(); } catch (e) { } miniMap = null; } }
    function drawCheckinMap(shop) {
      destroyMiniMap();
      const el = $('ci-map');
      if (!el) return;
      const me = S.lastPos && S.lastPos.latitude != null ? L.latLng(+S.lastPos.latitude, +S.lastPos.longitude) : null;
      const sp = hasLoc(shop) ? L.latLng(+shop.shop_latitude, +shop.shop_longitude) : null;
      if (typeof L === 'undefined' || (!me && !sp)) { el.hidden = true; return; }
      miniMap = L.map(el, {
        zoomControl: false, attributionControl: true, dragging: false, touchZoom: false, scrollWheelZoom: false,
        doubleClickZoom: false, boxZoom: false, keyboard: false, tap: false, zoomSnap: 0.25
      }).setView(sp || me, 17);
      miniMap.attributionControl.setPrefix(false);
      osmLayer(S.mapTile).addTo(miniMap);
      const pts = [];
      if (sp) {
        const r = Number(shop.geofence_radius) || 100;
        L.circle(sp, { radius: r, color: '#3346D3', weight: 1.5, opacity: 0.8, dashArray: '4 6', fillColor: '#3346D3', fillOpacity: 0.08, interactive: false }).addTo(miniMap);
        L.marker(sp, { icon: pinIcon('', 'ink', ic('store', 16, 2.2)), interactive: false, keyboard: false }).addTo(miniMap);
        const dLat = r / 111320, dLng = r / (111320 * Math.cos(sp.lat * Math.PI / 180));
        pts.push([sp.lat - dLat, sp.lng - dLng], [sp.lat + dLat, sp.lng + dLng]);
      }
      if (me) {
        if (sp) L.polyline([me, sp], { color: '#0F1633', weight: 2, opacity: 0.6, dashArray: '2 7', lineCap: 'round', interactive: false }).addTo(miniMap);
        L.marker(me, {
          icon: L.divIcon({ className: 'sx-mk', html: '<div class="puck puck--me"><span class="puck-halo"></span><span class="puck-core"></span></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
          interactive: false, keyboard: false, zIndexOffset: 200
        }).addTo(miniMap);
        pts.push([me.lat, me.lng]);
      }
      if (pts.length > 1) miniMap.fitBounds(L.latLngBounds(pts), { padding: [28, 28], paddingTopLeft: [28, 28], paddingBottomRight: [28, 28], maxZoom: 18 });
      setTimeout(() => miniMap && miniMap.invalidateSize(), 60);
    }

    async function takeVisitPhoto(kind) {
      try {
        const b64 = await capturePhoto(kind === 'selfie' ? 'user' : 'environment');
        S.photos[kind] = b64;
        const tile = $('proof-' + kind);
        if (tile) tile.outerHTML = proofTile(kind);
        updateProofCount();
      } catch (e) {
        if (e.message !== 'Photo cancelled') toast(e.message, 'err');
      }
    }

    async function setShopLocationHere(customer) {
      const shop = S.shops.find(s => s.name === customer);
      const ok = await askConfirm({
        title: 'Save this as the shop location?',
        message: `Do this only while you are at ${shop ? shopName(shop) : 'the shop'}. Future check-ins are measured from this point.`,
        ok: 'Save location', icon: 'locate'
      });
      if (!ok) return;
      await run('Saving shop location…', async () => {
        const p = await getPos();
        await api('set_shop_location', { customer: customer, latitude: p.latitude, longitude: p.longitude });
        toast('Shop location saved', 'ok');
        S.shops = sortByDistance(await api('my_shops', { latitude: p.latitude, longitude: p.longitude }));
        if (S.tab === 'cust') return renderCustomerDirectory();
        S.selectedShop = S.shops.find(s => s.name === customer) || S.selectedShop;
        if (S.tab === 'visit' && S.selectedShop) renderCheckinForm();
      });
    }

    async function submitCheckin() {
      if (!S.selectedShop) return;
      if (!S.photos.selfie || !S.photos.shop) {
        const go = await askConfirm({
          title: 'Check in without both photos?',
          message: 'A selfie and a shop photo are your proof of visit.',
          ok: 'Check in anyway', cancel: 'Take photos', icon: 'camera', tone: 'gold'
        });
        if (!go) return;
      }
      const rem = $('checkin-remarks') ? $('checkin-remarks').value : '';
      await run('Checking in…', async () => {
        const p = await getPos();
        const r = await api('shop_checkin', {
          customer: S.selectedShop.name,
          latitude: p.latitude,
          longitude: p.longitude,
          selfie_b64: S.photos.selfie,
          shop_photo_b64: S.photos.shop,
          remarks: rem,
        });
        S.activeVisit = {
          name: r.visit,
          customer: S.selectedShop.name,
          customer_name: S.selectedShop.customer_name || shopName(S.selectedShop),
          shop_name: S.selectedShop.shop_name || '',
          check_in_time: nowLocalStr(),
        };
        S.cart = [];
        updateFabBadge();
        toast('Checked in. Visit started.', 'ok');
        renderActiveVisit(S.activeVisit);
      });
    }

    // ---------- Active visit: order + checkout ----------
    const QUICK_NOTES = ['Stock sufficient', 'Payment collected', 'Owner not available', 'Follow up next week', 'New range shown'];

    function renderActiveVisit(visit) {
      const activeV = ((S.status && S.status.visits) || []).find(v => v.name === visit.name) || visit;
      if (S.cartVisitName !== visit.name) {
        S.cart = (activeV.details || []).map(item => ({
          code: item.item,
          name: item.item_name || item.item,
          uom: item.stock_uom,
          qty: Number(item.qty) || 0,
          price: Number(item.price) || 0,
        }));
        S.cartVisitName = visit.name;
      }
      const initialQty = activeV.order_qty ? activeV.order_qty : '';
      const initialRemarks = activeV.remarks || '';
      const name = visit.shop_name || visit.customer_name || visit.customer;

      paint(`
        <section class="visit-hero topo">
          <div class="vh-top">
            <span class="hero-pill"><span class="dot live"></span>Visit in progress</span>
            <span class="vh-timer" data-since="${esc(visit.check_in_time)}" data-fmt="ms">${fmtMS(Date.now() - (parseDT(visit.check_in_time) || Date.now()))}</span>
          </div>
          <h2>${esc(name)}</h2>
          <p>Checked in at ${t12(visit.check_in_time)}, visit ${esc(visit.name)}</p>
        </section>

        <section class="panel">
          <div class="sec-head">
            <div class="grow"><h2>Order</h2><p>Type the total, or build it from products</p></div>
            <span id="cart-counter" class="badge">No items</span>
          </div>
          <label class="field-label" for="visit-order-qty">Total quantity in units</label>
          <div class="qty-big">
            <button type="button" onclick="bumpQty(-1)" aria-label="Decrease quantity">−</button>
            <input id="visit-order-qty" type="number" inputmode="numeric" min="0" value="${esc(initialQty)}" placeholder="0">
            <button type="button" onclick="bumpQty(1)" aria-label="Increase quantity">+</button>
          </div>
          <div class="qty-note" id="qty-note"></div>
          <div class="divider-label">or pick from the catalog</div>
          <div class="search">${ic('search', 18)}<input id="item-search" type="search" placeholder="Search products" oninput="searchCatalog(this.value)" autocomplete="off"></div>
          <div id="catalog-list" class="catalog"></div>
          <div id="cart-list"></div>
        </section>

        <section class="panel">
          <label class="field-label" for="visit-remarks">Discussion notes</label>
          <textarea id="visit-remarks" rows="3" placeholder="Stock position, payment, next order date">${esc(initialRemarks)}</textarea>
          <div class="quick-notes">${QUICK_NOTES.map(n => `<button type="button" class="qn" onclick="addNote(${arg(n)})">+ ${esc(n)}</button>`).join('')}</div>
        </section>

        <div class="action-stack">
          <button class="btn success lg" onclick="saveAndCheckout(${arg(visit.name)})">${ic('check', 20, 2.6)} Save order and check out</button>
          <button class="btn ghost" onclick="cancelOrDirectCheckout(${arg(visit.name)})">Check out with no order</button>
        </div>`);
      searchCatalog('');
      drawCart();
    }

    function addNote(n) {
      const t = $('visit-remarks'); if (!t) return;
      const cur = t.value.trim();
      t.value = cur ? cur.replace(/[.;,]$/, '') + '; ' + n : n;
    }

    function bumpQty(d) {
      if (S.cart.length) return toast('The total follows the products you picked');
      const i = $('visit-order-qty'); if (!i) return;
      i.value = Math.max(0, (parseFloat(i.value) || 0) + d);
    }

    let catalogTimer = null;
    function searchCatalog(q) {
      clearTimeout(catalogTimer);
      catalogTimer = setTimeout(async () => {
        try {
          S.catalog = await api('item_list', {
            search: q,
            customer: S.activeVisit && S.activeVisit.customer,
          }) || [];
          renderCatalog();
        } catch (e) { }
      }, 250);
    }

    function renderCatalog() {
      const el = $('catalog-list'); if (!el) return;
      const items = S.catalog || [];
      el.innerHTML = items.length ? items.map((it, idx) => {
        const inCart = S.cart.find(c => c.code === it.item_code);
        return `
          <button type="button" class="cat-row ${inCart ? 'in' : ''}" onclick="addToCart(${idx})">
            <span class="cat-main"><b>${esc(it.item_name)}</b><span>${esc(it.item_code)} · ${esc(it.stock_uom || 'Nos')} · Price: ${esc(it.price || 0)}</span></span>
            <span class="cat-add">${inCart ? esc(inCart.qty) : ic('plus', 16, 2.4)}</span>
          </button>`;
      }).join('') : '<div class="empty" style="padding:14px"><p>No products match that search.</p></div>';
    }

    function addToCart(idx) {
      const item = S.catalog[idx]; if (!item) return;
      const existing = S.cart.find(c => c.code === item.item_code);
      if (existing) existing.qty += 1;
      else S.cart.push({ code: item.item_code, name: item.item_name, uom: item.stock_uom, qty: 1, price: Number(item.price) || 0 });
      renderCatalog();
      drawCart();
    }

    function updateCartQty(code, delta) {
      const item = S.cart.find(c => c.code === code);
      if (!item) return;
      item.qty += delta;
      if (item.qty <= 0) S.cart = S.cart.filter(c => c.code !== code);
      renderCatalog();
      drawCart();
    }

    function setCartQtyDirect(code, val) {
      const num = parseFloat(val) || 0;
      if (num <= 0) S.cart = S.cart.filter(c => c.code !== code);
      else { const item = S.cart.find(c => c.code === code); if (item) item.qty = num; }
      renderCatalog();
      drawCart();
    }

    function drawCart() {
      const el = $('cart-list'), cnt = $('cart-counter');
      const units = S.cart.reduce((sum, c) => sum + (c.qty || 0), 0);
      if (cnt) {
        cnt.textContent = S.cart.length ? `${S.cart.length} item${S.cart.length === 1 ? '' : 's'}, ${units} units` : 'No items';
        cnt.className = 'badge ' + (S.cart.length ? 'brand' : '');
      }
      const qi = $('visit-order-qty'), note = $('qty-note');
      if (qi) { if (units > 0) qi.value = units; qi.readOnly = units > 0; }
      if (note) note.textContent = units > 0 ? 'Total is calculated from the products below.' : '';
      if (!el) return;
      if (!S.cart.length) { el.innerHTML = ''; return; }
      el.innerHTML = `
        <div class="cart">
          <div class="cart-head"><span>Selected products</span><span>${units} units</span></div>
          ${S.cart.map(c => `
            <div class="cart-row">
              <div class="cart-main"><b>${esc(c.name)}</b><span>${esc(c.code)} · Quantity: ${esc(c.qty)} · Price: ${esc(c.price || 0)} per ${esc(c.uom || 'unit')}</span></div>
              <div class="stepper">
                <button type="button" onclick="updateCartQty(${arg(c.code)}, -1)" aria-label="One less">−</button>
                <input type="number" inputmode="numeric" min="1" value="${esc(c.qty)}" onchange="setCartQtyDirect(${arg(c.code)}, this.value)" aria-label="Quantity">
                <button type="button" onclick="updateCartQty(${arg(c.code)}, 1)" aria-label="One more">+</button>
              </div>
            </div>`).join('')}
        </div>`;
    }

    async function saveAndCheckout(visitName) {
      const manualQty = parseFloat($('visit-order-qty') ? $('visit-order-qty').value : 0) || 0;
      const cartQty = S.cart.reduce((sum, c) => sum + (c.qty || 0), 0);
      const totalQty = cartQty > 0 ? cartQty : manualQty;
      const remarks = ($('visit-remarks') ? $('visit-remarks').value : '').trim();
      const items = S.cart.filter(c => c.qty > 0).map(c => ({ item_code: c.code, qty: c.qty, price: c.price }));

      await run('Saving order and checking out…', async () => {
        if (items.length > 0 || totalQty > 0) {
          await api('create_order', { visit: visitName, items: JSON.stringify(items), order_qty: totalQty, remarks: remarks });
        }
        await api('shop_checkout', { visit: visitName, remarks: remarks, order_qty: totalQty });
        S.activeVisit = null;
        S.cart = [];
        S.cartVisitName = null;
        toast(totalQty > 0 ? `Order of ${totalQty} units saved. Visit complete.` : 'Visit complete.', 'ok');
        await refreshTodayStatus();
        navigate('day');
      });
    }

    async function cancelOrDirectCheckout(visitName) {
      const ok = await askConfirm({ title: 'Check out with no order?', message: 'The visit is saved as a nil visit with your notes.', ok: 'Check out', icon: 'store' });
      if (!ok) return;
      const remarks = ($('visit-remarks') ? $('visit-remarks').value : '').trim();
      await run('Checking out…', async () => {
        await api('shop_checkout', { visit: visitName, remarks: remarks || 'Nil Order' });
        S.activeVisit = null;
        S.cart = [];
        S.cartVisitName = null;
        toast('Visit complete.', 'ok');
        await refreshTodayStatus();
        navigate('day');
      });
    }

    async function renderCustomers() {
      paint(`<div class="page-head"><div class="grow"><h1>Customers</h1><p>Loading your shops…</p></div></div>${skeleton(4)}`);

      if (S.tab !== 'cust') return;

    function renderCustomerDirectory() {
      paint(`

    let newCustGps = null;
    function openAddCustomerModal() {
      const tt = $('nc-territory');
      if (tt) {
        const list = (S.meta.territories && S.meta.territories.length) ? S.meta.territories : ['India', 'All Territories'];
        tt.innerHTML = list.map(t => `<option value="${esc(t)}">${esc(t)}</option>`).join('');
      }

    async function captureCustomerGPS() {
      try {
        const p = await getPos();
        newCustGps = { lat: p.latitude, lng: p.longitude };
        $('nc-gps-txt').textContent = `${Number(p.latitude).toFixed(5)}, ${Number(p.longitude).toFixed(5)}`;
        $('nc-gps-row').classList.add('got');

    async function handleSaveCustomer(e) {
      e.preventDefault();
      const shopName_ = $('nc-shop-name').value.trim();
      if (!shopName_) return toast('Enter the shop name', 'err');
      const custName = $('nc-name').value.trim() || shopName_;

      await run('Saving shop…', async () => {
        const res = await api('add_customer', {
          shop_name: shopName_,
          customer_name: custName,
          contact_person: $('nc-contact').value.trim(),
          mobile_no: $('nc-mobile').value.trim(),
          address: $('nc-addr').value.trim(),
          territory: $('nc-territory') ? $('nc-territory').value : 'All Territories',
          customer_group: ($('nc-group') && $('nc-group').value) ? $('nc-group').value : 'Commercial',
          latitude: newCustGps ? newCustGps.lat : null,
          longitude: newCustGps ? newCustGps.lng : null,

    function buildReportText() {
      const d = S.dailyReportData;
      if (!d) return '';
      const r = d.report || {};
      const cin = r.clock_in ? hm(r.clock_in) : 'Not recorded';
      const cout = r.clock_out ? hm(r.clock_out) : 'Still on duty';
      const emp = d.employee_name || 'Sales Executive';

      let text = `📊 DAILY SALES REPORT\n`;
      text += `👤 Salesperson: ${emp}\n`;
      text += `📅 Date: ${d.date}\n`;
      text += `⏰ Duty: Clock in ${cin} / Clock out ${cout}\n`;
      text += `⏱️ Working Hours: ${r.working_hours || 0} hrs\n`;
      text += `🏪 Shops Visited: ${r.shops_visited || 0}\n`;
      text += `📦 Total Order Qty: ${r.total_order_qty || 0}\n`;
      text += `🚗 KM Travelled: ${r.km_travelled || '0.0'} km\n\n`;

      if (d.visits && d.visits.length > 0) {
        text += `VISIT DETAILS:\n`;
        d.visits.forEach((v, i) => {
          text += `${i + 1}. ${v.customer_name || v.customer}\n`;
          text += `   Time: ${hm(v.check_in_time)} - ${v.check_out_time ? hm(v.check_out_time) : 'Active'}\n`;
          if (v.order_qty) text += `   Order: ${v.order_qty} units ${v.sales_order ? '(' + v.sales_order + ')' : ''}\n`;
          (v.details || []).forEach(item => {
            text += `   Item: ${item.item_name || item.item} | Quantity: ${item.qty} | Price: ${item.price || 0}\n`;
          });
          if (v.remarks) text += `   Remarks: ${v.remarks}\n`;
        });
      } else {
        text += `No visits logged yet.\n`;
      }
      return text;
    }

    function copyReportToClipboard() {
      const text = buildReportText().replace(/\*/g, '');
      if (!text) return;
      const done = () => toast('Report copied. Paste it into WhatsApp or email.', 'ok');
      const fallback = () => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        let ok = false;
        try { ok = document.execCommand('copy'); } catch (e) { }
        document.body.removeChild(ta);
        ok ? done() : toast('Copy is blocked on this device. Select the report text and copy it manually.', 'err');
      };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done).catch(fallback);
      else fallback();
    }
