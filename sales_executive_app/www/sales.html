    // =================================================================
    //  5. MAP  (Leaflet + OpenStreetMap)
    //  Every map in the app uses OpenStreetMap tiles. "Soft" is the same
    //  tiles with muted colours (CSS filter). To use your own OSM tile
    //  server, change OSM_TILE_URL.
    // =================================================================
    const OSM_TILE_URL = 'https://tile.openstreetmap.org/{z}/{x}/{y}.png';
    const OSM_OPTS = {
      maxZoom: 19, referrerPolicy: 'strict-origin-when-cross-origin',
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors'
    };
    const TILES = {
      standard: { label: 'Standard', url: OSM_TILE_URL, opts: OSM_OPTS },
      soft: { label: 'Soft', url: OSM_TILE_URL, opts: OSM_OPTS },
    };
    const osmLayer = k => { const t = TILES[k] || TILES.standard; return typeof t.make === 'function' ? t.make() : L.tileLayer(t.url, t.opts); };
    const MAP_MODES = ['live', 'route', 'shops'];

    let leafletMap = null, mapLayersGroup = null, liveMapTimer = null, tileLayer = null, tileSig = null, meLayer = null, sheetRO = null;
    let MK = {};
    const PB = { pts: [], lls: [], idx: 0, playing: false, speed: 1, rate: 1, raf: null, last: 0, puck: null, done: null, pad: null, panning: false };

    S.mapMode = 'live';     // 'live' | 'route' | 'shops'
    S.mapTargetEmp = null;
    S.mapDate = null;
    S.mapTerritory = null;
    S.mapSel = null;
    S.mapSheetCollapsed = window.innerHeight < 720;   // short phones start with the map uncovered
    S.mapTile = (() => { try { return localStorage.getItem('sx_map_style') || 'standard'; } catch (e) { return 'standard'; } })();
    S.mapFocus = null;   // marker key to open after the map loads (from "Map" on a customer card)

    const spTone = sp => (sp && sp.color === 'green') ? 'green' : (sp && sp.color === 'orange') ? 'orange' : 'grey';
    const selectedSp = res => res.salespeople.find(sp => sp.employee === res.selected_employee) || res.salespeople[0] || {};
    const msEmpty = (icon, title, text) => `<div class="ms-empty">${ic(icon, 22)}<div><b>${esc(title)}</b>${esc(text)}</div></div>`;

    function renderMap(targetDate = null) {
      const d = targetDate || S.mapDate || (S.status ? S.status.date : null) || localDateStr();
      S.mapDate = d;
      const seg = m => `class="${S.mapMode === m ? 'on' : ''}" data-m="${m}" onclick="switchMapMode('${m}')" role="tab" aria-selected="${S.mapMode === m}"`;

      paint(`
        <section class="map-stage" id="map-stage" data-tile="${esc(S.mapTile)}">
          <div id="leaflet-map" aria-label="Map"></div>

          <div class="map-top">
            <div class="seg" id="map-seg" style="--i:${MAP_MODES.indexOf(S.mapMode)}" role="tablist" aria-label="Map view">
              <span class="seg-ind"></span>
              <button ${seg('live')}><span class="dot live"></span>Live</button>
              <button ${seg('route')}>${ic('route', 16)}Route</button>
              <button ${seg('shops')}>${ic('store', 16)}Shops</button>
            </div>
            <div class="map-chips">
              <div class="mchip">
                <span class="av av-xs av-grey" id="mc-emp-av">··</span><span id="mc-emp">Salesperson</span>${ic('chev', 14, 2.4)}
                <select id="map-emp-select" onchange="changeMapEmployee(this.value)" aria-label="Salesperson"><option value="">Select salesperson</option></select>
              </div>
              <div class="mchip">
                ${ic('cal', 15)}<span id="mc-date">${esc(chipDate(d))}</span>
                <input type="date" id="map-date-input" value="${esc(d)}" max="${localDateStr()}" onchange="changeMapDate(this.value)" onclick="try{this.showPicker()}catch(e){}" aria-label="Date">
              </div>
              <div class="mchip">
                ${ic('pin', 15)}<span id="mc-terr">${esc(S.mapTerritory || 'All areas')}</span>${ic('chev', 14, 2.4)}
                <select id="map-terr-select" onchange="changeMapTerritory(this.value)" aria-label="Area"><option value="">All areas</option></select>
              </div>
            </div>
          </div>

          <div class="map-fabs">
            <div class="fab-group">
              <button onclick="leafletMap && leafletMap.zoomIn()" aria-label="Zoom in">${ic('plus', 18, 2.2)}</button>
              <button onclick="leafletMap && leafletMap.zoomOut()" aria-label="Zoom out">${ic('minus', 18, 2.2)}</button>
            </div>
            <div class="fab-wrap">
              <button class="fab" id="fab-layers" onclick="toggleLayerMenu(event)" aria-label="Map style" aria-expanded="false">${ic('layers', 19)}</button>
              <div class="layer-menu" id="layer-menu">
                ${Object.keys(TILES).map(k => `<button class="lm-opt ${S.mapTile === k ? 'on' : ''}" data-k="${k}" onclick="setMapTile('${k}')"><span class="lm-sw lm-${k}"></span>${esc(TILES[k].label)}</button>`).join('')}
              </div>
            </div>
            <button class="fab" onclick="locateMe()" aria-label="Show my location">${ic('locate', 19)}</button>
            <button class="fab" onclick="fitMap(true)" aria-label="Show everything">${ic('fit', 19)}</button>
          </div>

          <div class="map-loading" id="map-loading"><span class="spinner sm on-dark"></span>Updating map</div>

          <div class="map-sheet ${S.mapSheetCollapsed ? 'collapsed' : ''}" id="map-sheet">
            <button class="sheet-handle" onclick="setSheetCollapsed(!S.mapSheetCollapsed)" aria-label="Show or hide details"><span></span></button>
            <div class="ms-summary" id="ms-summary"><div class="skel" style="height:46px;margin:0"></div></div>
            <div class="ms-body" id="ms-body"></div>
          </div>
        </section>`);

      measureHeader();
      if (typeof L === 'undefined') {
        $('ms-summary').innerHTML = msEmpty('alert', 'The map could not load', 'Check your internet connection, then open the Map tab again.');
        return;
      }
      initLeafletMapInstance();
      bindSheetGestures();
      reloadMapData(true);

      clearInterval(liveMapTimer);
      liveMapTimer = setInterval(() => {
        if (S.tab === 'map' && S.mapMode === 'live' && !document.hidden) reloadMapData(false);
      }, 60000);
    }

    function initLeafletMapInstance() {
      if (leafletMap) { try { leafletMap.remove(); } catch (e) { } leafletMap = null; }
      const lat = TEST ? TEST.lat : (S.lastPos ? S.lastPos.latitude : 11.0168);
      const lng = TEST ? TEST.lng : (S.lastPos ? S.lastPos.longitude : 76.9558);
      leafletMap = L.map('leaflet-map', { zoomControl: false, attributionControl: true, zoomSnap: 0.25, wheelPxPerZoomLevel: 90 }).setView([lat, lng], 13);
      leafletMap.attributionControl.setPrefix(false);
      leafletMap.attributionControl.setPosition('bottomleft');
      tileLayer = null;
      tileSig = null;
      meLayer = null;
      setMapTile(S.mapTile, true);
      mapLayersGroup = L.featureGroup().addTo(leafletMap);
      leafletMap.on('click', closeLayerMenu);
      observeSheet();
      setTimeout(() => leafletMap && leafletMap.invalidateSize(), 80);
    }

    function setMapTile(k, silent) {
      if (!TILES[k]) k = 'standard';
      S.mapTile = k;
      try { localStorage.setItem('sx_map_style', k); } catch (e) { }
      document.querySelectorAll('.lm-opt').forEach(b => b.classList.toggle('on', b.dataset.k === k));
      const st = $('map-stage'); if (st) st.dataset.tile = k;
      if (!silent) closeLayerMenu();
      if (!leafletMap) return;
      const t = TILES[k], sig = (typeof t.make === 'function' ? 'make:' : '') + t.url;
      if (tileLayer && sig === tileSig) return;      // same OSM tiles; only the CSS style changed
      if (tileLayer) leafletMap.removeLayer(tileLayer);
      tileLayer = osmLayer(k).addTo(leafletMap);
      tileSig = sig;
      if (tileLayer.bringToBack) tileLayer.bringToBack();
    }

    function toggleLayerMenu(e) {
      if (e) e.stopPropagation();
      const m = $('layer-menu'); if (!m) return;
      const open = !m.classList.contains('open');
      m.classList.toggle('open', open);
      const b = $('fab-layers');
      if (b) { b.classList.toggle('on', open); b.setAttribute('aria-expanded', String(open)); }
    }
    function closeLayerMenu() {
      const m = $('layer-menu'); if (m) m.classList.remove('open');
      const b = $('fab-layers'); if (b) { b.classList.remove('on'); b.setAttribute('aria-expanded', 'false'); }
    }

    function observeSheet() {
      if (sheetRO) { sheetRO.disconnect(); sheetRO = null; }
      const sh = $('map-sheet'), st = $('map-stage');
      if (!sh || !st) return;
      const set = () => st.style.setProperty('--sheet-h', sh.offsetHeight + 'px');
      set();
      if (window.ResizeObserver) { sheetRO = new ResizeObserver(set); sheetRO.observe(sh); }
    }
    function setSheetCollapsed(v) {
      S.mapSheetCollapsed = !!v;
      const sh = $('map-sheet'); if (sh) sh.classList.toggle('collapsed', S.mapSheetCollapsed);
    }
    function bindSheetGestures() {
      const sh = $('map-sheet'); if (!sh) return;
      let y0 = null;
      sh.addEventListener('touchstart', e => {
        y0 = e.target.closest('.ms-rail, .pb, input, select, a, button:not(.sheet-handle)') ? null : e.touches[0].clientY;
      }, { passive: true });
      sh.addEventListener('touchend', e => {
        if (y0 == null) return;
        const dy = e.changedTouches[0].clientY - y0;
        if (dy > 36) setSheetCollapsed(true);
        else if (dy < -36) setSheetCollapsed(false);
        y0 = null;
      }, { passive: true });
    }

    // Visible map area = stage minus the floating top bar, controls and bottom sheet
    function mapPadding() {
      const st = $('map-stage'), sh = $('map-sheet'), top = document.querySelector('.map-top');
      if (!st || !sh) return { paddingTopLeft: [30, 30], paddingBottomRight: [30, 30] };
      const sr = st.getBoundingClientRect();
      const topPx = (top ? top.getBoundingClientRect().bottom - sr.top : 0) + 22;
      const botPx = Math.max(40, sr.bottom - sh.getBoundingClientRect().top + 22);
      return { paddingTopLeft: [34, topPx], paddingBottomRight: [66, botPx] };
    }
    function popupOpts() {
      const p = mapPadding();
      return {
        className: 'sx-pop', closeButton: false, minWidth: 232, maxWidth: 272,
        autoPanPaddingTopLeft: L.point(16, p.paddingTopLeft[1]),
        autoPanPaddingBottomRight: L.point(60, p.paddingBottomRight[1]),
      };
    }

    async function reloadMapData(showLoading = true) {
      const ld = $('map-loading');
      if (showLoading && ld) ld.classList.add('show');
      try {
        const res = await api('get_map_view_data', { employee: S.mapTargetEmp, date: S.mapDate, territory: S.mapTerritory }) || {};
        if (S.tab !== 'map' || !leafletMap) return;
        ['salespeople', 'visits', 'route', 'shops'].forEach(k => { if (!Array.isArray(res[k])) res[k] = []; });
        S.mapData = res;
        if (!S.mapTargetEmp && res.selected_employee) S.mapTargetEmp = res.selected_employee;
        fillMapFilters(res);
        drawMapLayers(res);
        renderMapSheet(res);
        const focus = S.mapFocus;
        S.mapFocus = null;
        if (focus && MK[focus]) requestAnimationFrame(() => focusMarker(focus));
        else if (showLoading) requestAnimationFrame(() => fitMap(true));
      } catch (e) {
        toast(e.message || 'Could not load the map', 'err');
        const sum = $('ms-summary');
        if (sum && !S.mapData) sum.innerHTML = msEmpty('alert', 'Map data did not load', 'Pull the sheet down and tap a mode to retry.');
      } finally {
        if (ld) ld.classList.remove('show');
      }
    }

    function fillMapFilters(res) {
      const sp = selectedSp(res);
      const empSel = $('map-emp-select');
      if (empSel) {
        empSel.innerHTML = res.salespeople.length
          ? res.salespeople.map(x => `<option value="${esc(x.employee)}" ${x.employee === res.selected_employee ? 'selected' : ''}>${esc(x.employee_name)} (${esc(x.status || '')})</option>`).join('')
          : '<option value="">No salespeople</option>';
      }
      const name = sp.employee_name || 'Salesperson';
      if ($('mc-emp')) $('mc-emp').textContent = name;
      const av = $('mc-emp-av');
      if (av) { av.textContent = initials(name); av.className = 'av av-xs av-' + spTone(sp); }

      const terrSel = $('map-terr-select');
      if (terrSel && terrSel.options.length <= 1 && (S.meta.territories || []).length) {
        terrSel.innerHTML = '<option value="">All areas</option>' + S.meta.territories.map(t => `<option value="${esc(t)}" ${t === S.mapTerritory ? 'selected' : ''}>${esc(t)}</option>`).join('');
      }
      if ($('mc-terr')) $('mc-terr').textContent = S.mapTerritory || 'All areas';
      if ($('mc-date')) $('mc-date').textContent = chipDate(S.mapDate);
    }

    function drawMapLayers(res) {
      if (!mapLayersGroup || !leafletMap) return;
      const openKey = Object.keys(MK).find(k => MK[k].isPopupOpen && MK[k].isPopupOpen());
      stopPlayback();
      mapLayersGroup.clearLayers();
      MK = {};
      PB.pts = []; PB.lls = []; PB.done = null;

      if (S.mapMode === 'live') drawLive(res);
      else if (S.mapMode === 'route') drawRoute(res);
      else drawShops(res);
      drawMe();

      if (openKey && MK[openKey]) MK[openKey].openPopup();
      if (S.mapSel && MK[S.mapSel]) selectMapItem(S.mapSel, true);
    }

    function pinIcon(label, t, glyph) {
      return L.divIcon({
        className: 'sx-mk',
        html: `<div class="pin pin--${t}"><svg viewBox="0 0 36 46" aria-hidden="true"><path d="M18 44C18 44 3 29.5 3 18A15 15 0 1 1 33 18C33 29.5 18 44 18 44Z"/></svg><span class="pin-in">${glyph || esc(label)}</span></div>`,
        iconSize: [36, 46], iconAnchor: [18, 44], popupAnchor: [0, -40]
      });
    }

    // --- Live: one avatar pin per salesperson at last known location ---
    function livePopup(sp) {
      const t = spTone(sp), loc = sp.last_location || {};
      return `
        <div class="pop-head"><span class="av av-sm av-${t}">${esc(initials(sp.employee_name))}</span><div class="grow"><b>${esc(sp.employee_name)}</b><span class="st st--${t}"><i></i>${esc(sp.status || '')}</span></div></div>
        <div class="pop-grid">
          <div><span>Clock in</span><b>${sp.clock_in ? t12(sp.clock_in) : '—'}</b></div>
          <div><span>Last seen</span><b>${sp.last_updated ? relTime(sp.last_updated) : '—'}</b></div>
          <div><span>Speed</span><b>${esc(loc.speed || 0)} km/h</b></div>
          <div><span>Battery</span><b>${loc.battery != null ? esc(loc.battery) + '%' : '—'}</b></div>
        </div>
        <div class="pop-actions"><button class="mini primary" onclick="viewRouteFor(${arg(sp.employee)})">${ic('route', 14)} Show route</button></div>`;
    }

    function drawLive(res) {
      res.salespeople.forEach(sp => {
        const loc = sp.last_location;
        if (!loc || !loc.latitude || !loc.longitude) return;
        const t = spTone(sp), key = 'sp:' + sp.employee;
        const icon = L.divIcon({
          className: 'sx-mk',
          html: `<div class="pp pp--${t} ${sp.employee === res.selected_employee ? 'is-sel' : ''}"><span class="pp-halo"></span><span class="pp-tail"></span><span class="pp-av">${esc(initials(sp.employee_name))}</span></div>`,
          iconSize: [46, 54], iconAnchor: [23, 52], popupAnchor: [0, -48]
        });
        const m = L.marker([+loc.latitude, +loc.longitude], { icon, riseOnHover: true, title: sp.employee_name || '' });
        m.bindPopup(livePopup(sp), popupOpts());
        m.on('click', () => selectMapItem(key, false));
        MK[key] = m;
        mapLayersGroup.addLayer(m);
      });
    }

    function viewRouteFor(emp) {
      if (leafletMap) leafletMap.closePopup();
      S.mapTargetEmp = emp;
      S.mapSel = null;
      S.mapMode = 'route';
      setSegUI('route');
      const body = $('ms-body'); if (body) body.innerHTML = '';
      reloadMapData(true);
    }

    // --- Route: casing + trail + progress line, start/end markers, numbered stops ---
    function visitPopup(v, idx) {
      const susp = Boolean(v.is_suspicious);
      const t = susp ? 'red' : v.check_out_time ? 'indigo' : 'gold';
      return `
        <div class="pop-head"><span class="num num--${t}">${susp ? '!' : idx + 1}</span><div class="grow"><b>${esc(v.customer_name || v.customer)}</b>${susp ? `<span class="badge far">${ic('alert', 12)} Suspicious visit</span>` : `<span class="st">${v.check_out_time ? 'Completed' : 'In progress'}</span>`}</div></div>
        <div class="pop-grid">
          <div><span>Check-in</span><b>${t12(v.check_in_time) || '—'}</b></div>
          <div><span>Check-out</span><b>${v.check_out_time ? t12(v.check_out_time) : 'In progress'}</b></div>
          <div><span>Waiting time</span><b>${esc(v.waiting_time || 0)} min</b></div>
          <div><span>Order qty</span><b>${esc(v.order_qty || 0)} units</b></div>
        </div>
        ${v.sales_order ? `<div class="pop-foot">${ic('note', 14)} Sales order ${esc(v.sales_order)}</div>` : ''}
        ${v.distance_from_shop ? `<div class="pop-foot">${ic('pin', 14)} Checked in ${fmtDist(v.distance_from_shop)} from the shop</div>` : ''}`;
    }

    function drawRoute(res) {
      const pts = (res.route || []).filter(p => p && p.latitude && p.longitude);
      PB.pts = pts;
      PB.lls = pts.map(p => L.latLng(+p.latitude, +p.longitude));
      PB.idx = Math.max(0, PB.lls.length - 1);
      const sel = selectedSp(res);

      if (PB.lls.length) {
        const line = { lineCap: 'round', lineJoin: 'round', interactive: false };
        mapLayersGroup.addLayer(L.polyline(PB.lls, Object.assign({ color: '#FFFFFF', weight: 10, opacity: 0.95 }, line)));
        mapLayersGroup.addLayer(L.polyline(PB.lls, Object.assign({ color: '#A9B3DB', weight: 5, opacity: 1 }, line)));
        PB.done = L.polyline(PB.lls, Object.assign({ color: '#3346D3', weight: 5, opacity: 1 }, line));
        mapLayersGroup.addLayer(PB.done);

        const first = pts[0], last = pts[pts.length - 1];
        const startIcon = L.divIcon({ className: 'sx-mk', html: `<div class="ep ep--start">${ic('flag', 14, 2.4)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });
        mapLayersGroup.addLayer(L.marker(PB.lls[0], { icon: startIcon, zIndexOffset: 200 })
          .bindPopup(`<div class="pop-head" style="margin:0"><span class="num num--mint">${ic('flag', 15, 2.4)}</span><div class="grow"><b>Day started</b><span class="st">${t12(first.time) || '—'}</span></div></div>`, popupOpts()));

        if (PB.lls.length > 1) {
          const onDuty = spTone(sel) === 'green' && S.mapDate === localDateStr();
          const endIcon = onDuty
            ? L.divIcon({ className: 'sx-mk', html: '<div class="puck"><span class="puck-halo"></span><span class="puck-core"></span></div>', iconSize: [22, 22], iconAnchor: [11, 11], popupAnchor: [0, -12] })
            : L.divIcon({ className: 'sx-mk', html: `<div class="ep ep--end">${ic('stop', 13, 2.4)}</div>`, iconSize: [30, 30], iconAnchor: [15, 15], popupAnchor: [0, -14] });
          mapLayersGroup.addLayer(L.marker(PB.lls[PB.lls.length - 1], { icon: endIcon, zIndexOffset: 300 })
            .bindPopup(`<div class="pop-head" style="margin:0"><span class="num num--${onDuty ? 'indigo' : 'ink'}">${ic(onDuty ? 'locate' : 'stop', 15, 2.4)}</span><div class="grow"><b>${onDuty ? 'Latest position' : 'Last recorded point'}</b><span class="st">${t12(last.time) || '—'}</span></div></div>`, popupOpts()));
        }
      }

      (res.visits || []).forEach((v, idx) => {
        if (!v.latitude || !v.longitude) return;
        const susp = Boolean(v.is_suspicious), key = 'v:' + idx;
        const t = susp ? 'red' : v.check_out_time ? 'indigo' : 'gold';
        const m = L.marker([+v.latitude, +v.longitude], { icon: pinIcon(susp ? '!' : String(idx + 1), t), zIndexOffset: 400, riseOnHover: true, title: v.customer_name || v.customer || '' });
        m.bindPopup(visitPopup(v, idx), popupOpts());
        m.on('click', () => selectMapItem(key, false));
        MK[key] = m;
        mapLayersGroup.addLayer(m);
      });
    }

    // --- Shops: pins with dashed geofence circles ---
    function shopPopup(s, radius) {
      const name = s.shop_name || s.customer_name;
      return `
        <div class="pop-head"><span class="av av-sm av-${tone(name)}">${esc(initials(name))}</span><div class="grow"><b>${esc(name)}</b><span class="st">${esc(s.territory || 'No territory')}</span></div></div>
        <div class="pop-grid">
          <div><span>Contact</span><b>${esc(s.contact_person || '—')}</b></div>
          <div><span>Geofence</span><b>${radius} m</b></div>
        </div>
        ${s.shop_name && s.customer_name && s.shop_name !== s.customer_name ? `<div class="pop-foot">${ic('user', 14)} Billed as ${esc(s.customer_name)}</div>` : ''}
        ${s.mobile_no ? `<div class="pop-foot">${ic('phone', 14)} <a href="tel:${esc(s.mobile_no)}">${esc(s.mobile_no)}</a></div>` : ''}
        <div class="pop-actions">
          <button class="mini primary" onclick="selectShopForVisit(${arg(s.name)})">${ic('pin', 14)} Start visit</button>
        </div>`;
    }

    function drawShops(res) {
      (res.shops || []).forEach(s => {
        if (!s.latitude || !s.longitude) return;
        const radius = Number(s.geofence_radius) || 100, key = 's:' + s.name;
        mapLayersGroup.addLayer(L.circle([+s.latitude, +s.longitude], {
          radius, color: '#3346D3', weight: 1.5, opacity: 0.75, dashArray: '4 6',
          fillColor: '#3346D3', fillOpacity: 0.07, interactive: false
        }));
        const m = L.marker([+s.latitude, +s.longitude], { icon: pinIcon('', 'ink', ic('store', 16, 2.2)), riseOnHover: true, title: s.shop_name || s.customer_name || '' });
        m.bindPopup(shopPopup(s, radius), popupOpts());
        m.on('click', () => selectMapItem(key, false));
        MK[key] = m;
        mapLayersGroup.addLayer(m);
      });
    }

    function drawMe() {
      if (!leafletMap) return;
      if (!meLayer) meLayer = L.layerGroup().addTo(leafletMap);
      meLayer.clearLayers();
      const p = S.lastPos;
      if (!p || p.latitude == null) return;
      const ll = [+p.latitude, +p.longitude];
      if (p.accuracy && p.accuracy < 300) {
        meLayer.addLayer(L.circle(ll, { radius: p.accuracy, color: '#1A73E8', weight: 1, opacity: 0.4, fillColor: '#1A73E8', fillOpacity: 0.08, interactive: false }));
      }
      meLayer.addLayer(L.marker(ll, {
        icon: L.divIcon({ className: 'sx-mk', html: '<div class="puck puck--me"><span class="puck-halo"></span><span class="puck-core"></span></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
        zIndexOffset: 100, interactive: false, keyboard: false
      }));
    }

    // --- Bottom sheet: summary + card rail synced with markers ---
    function liveCard(sp) {
      const t = spTone(sp), loc = sp.last_location || {}, key = 'sp:' + sp.employee;
      const has = loc.latitude && loc.longitude;
      const bat = loc.battery != null && loc.battery !== '' ? Number(loc.battery) : null;
      return `
        <button class="rail-card ${has ? '' : 'muted'}" data-key="${esc(key)}" ${has ? `onclick="focusMarker(${arg(key)})"` : 'disabled'}>
          <div class="rc-top"><span class="av av-sm av-${t}">${esc(initials(sp.employee_name))}</span><div class="rc-id"><b>${esc(sp.employee_name)}</b><span class="st st--${t}"><i></i>${esc(sp.status || '')}</span></div></div>
          <div class="rc-meta">
            <span>${ic('clock', 13)} ${has && sp.last_updated ? relTime(sp.last_updated) : 'No location'}</span>
            ${bat != null ? `<span class="${bat <= 20 ? 'low' : ''}">${ic('battery', 13)} ${bat}%</span>` : ''}
            <span>${ic('speed', 13)} ${esc(loc.speed || 0)} km/h</span>
          </div>
        </button>`;
    }

    function stopCard(v, idx) {
      const susp = Boolean(v.is_suspicious), key = 'v:' + idx;
      const t = susp ? 'red' : v.check_out_time ? 'indigo' : 'gold';
      const dur = v.check_out_time ? minsBetween(v.check_in_time, v.check_out_time) : null;
      const has = v.latitude && v.longitude;
      return `
        <button class="rail-card" data-key="${key}" ${has ? `onclick="focusMarker('${key}')"` : ''}>
          <div class="rc-top"><span class="num num--${t}">${susp ? '!' : idx + 1}</span><div class="rc-id"><b>${esc(v.customer_name || v.customer)}</b><span>${t12(v.check_in_time)} – ${v.check_out_time ? t12(v.check_out_time) : 'now'}</span></div></div>
          <div class="rc-meta">
            <span>${ic('box', 13)} ${v.order_qty ? esc(v.order_qty) + ' units' : (v.check_out_time ? 'Nil order' : 'No order yet')}</span>
            ${dur != null ? `<span>${ic('clock', 13)} ${fmtDur(dur)}</span>` : ''}
            ${susp ? `<span class="warn">${ic('alert', 13)} Flagged</span>` : ''}
          </div>
        </button>`;
    }

    function shopCard(s, d) {
      const name = s.shop_name || s.customer_name, key = 's:' + s.name;
      return `
        <div class="rail-card" data-key="${esc(key)}">
          <div class="rc-top" onclick="focusMarker(${arg(key)})" role="button" tabindex="0"><span class="av av-sm av-${tone(name)}">${esc(initials(name))}</span><div class="rc-id"><b>${esc(name)}</b><span>${esc(s.territory || 'No territory')}${d != null ? ', ' + fmtDist(d) + ' away' : ''}</span></div></div>
          <div class="rc-actions">
            <button class="mini primary" onclick="selectShopForVisit(${arg(s.name)})">${ic('pin', 14)} Start visit</button>
          </div>
        </div>`;
    }

    function renderMapSheet(res) {
      const sum = $('ms-summary'), body = $('ms-body');
      if (!sum || !body) return;
      const oldRail = body.querySelector('.ms-rail');
      const keepScroll = oldRail ? oldRail.scrollLeft : 0;
      const sel = selectedSp(res);

      if (S.mapMode === 'live') {
        const c = { green: 0, orange: 0, grey: 0 };
        res.salespeople.forEach(sp => { c[spTone(sp)]++; });
        const n = res.salespeople.length;
        sum.innerHTML = `
          <div class="ms-head">
            <div class="ms-title"><h3>Team on the map</h3><p>${n} ${n === 1 ? 'salesperson' : 'salespeople'}, updated ${t12(new Date())}</p></div>
            <span class="live-tag"><span class="dot live"></span>Live</span>
          </div>
          <div class="legend"><span><i class="lg-green"></i>${c.green} on duty</span><span><i class="lg-orange"></i>${c.orange} GPS off</span><span><i class="lg-grey"></i>${c.grey} day ended</span></div>`;
        body.innerHTML = n ? `<div class="ms-rail">${res.salespeople.map(liveCard).join('')}</div>` : msEmpty('users', 'No salespeople to show', 'Try another area.');
      } else if (S.mapMode === 'route') {
        const t = spTone(sel), pts = PB.pts, n = pts.length;
        const dur = n > 1 ? minsBetween(pts[0].time, pts[n - 1].time) : null;
        sum.innerHTML = `
          <div class="ms-head">
            <div class="ms-person"><span class="av av-sm av-${t}">${esc(initials(sel.employee_name))}</span>
              <div class="ms-title"><h3>${esc(sel.employee_name || 'Salesperson')}</h3><p><span class="st st--${t}"><i></i>${esc(sel.status || 'No status')}</span><span>${esc(chipDate(S.mapDate))}</span></p></div>
            </div>
          </div>
          <div class="kpis">
            <div><b>${esc(res.km_travelled || '0.0')}</b><span>km travelled</span></div>
            <div><b>${res.visits.length}</b><span>visits</span></div>
            <div><b>${dur != null ? fmtDur(dur) : '—'}</b><span>on the road</span></div>
          </div>`;
        body.innerHTML = (n
          ? `<div class="pb">
              <button class="pb-play" id="pb-play" onclick="togglePlayback()" aria-label="Play route">${ic('play', 18)}</button>
              <div class="pb-track">
                <input type="range" id="pb-range" min="0" max="${Math.max(1, n - 1)}" step="any" value="${n - 1}" oninput="scrubPlayback(this.value)" aria-label="Route position">
                <div class="pb-times"><span>${t12(pts[0].time)}</span><b id="pb-now">${t12(pts[n - 1].time)}</b><span>${t12(pts[n - 1].time)}</span></div>
              </div>
              <button class="pb-speed" id="pb-speed" onclick="cyclePlaybackSpeed()" aria-label="Playback speed">${PB.speed}×</button>
            </div>`
          : msEmpty('route', 'No GPS trail for this day', 'The route appears once location points are uploaded.'))
          + (res.visits.length ? `<div class="ms-rail">${res.visits.map(stopCard).join('')}</div>` : '');
      } else {
        const me = S.lastPos;
        const shops = (res.shops || []).filter(s => s.latitude && s.longitude)
          .map(s => ({ s, d: me ? haversineMeters(+me.latitude, +me.longitude, +s.latitude, +s.longitude) : null }))
          .sort((a, b) => (a.d == null ? 1e12 : a.d) - (b.d == null ? 1e12 : b.d));
        sum.innerHTML = `
          <div class="ms-head"><div class="ms-title"><h3>Shop map</h3><p>${shops.length} shop${shops.length === 1 ? '' : 's'} with saved GPS${S.mapTerritory ? ' in ' + esc(S.mapTerritory) : ''}, nearest first</p></div></div>`;
        body.innerHTML = shops.length
          ? `<div class="ms-rail">${shops.map(x => shopCard(x.s, x.d)).join('')}</div>`
          : msEmpty('store', 'No shops with GPS here', 'Save a shop location from its check-in screen.');
      }

      const rail = body.querySelector('.ms-rail');
      if (rail && keepScroll) rail.scrollLeft = keepScroll;
      if (S.mapSel) {
        const c = body.querySelector(`.rail-card[data-key="${cssEsc(S.mapSel)}"]`);
        if (c) c.classList.add('sel');
      }
    }

    function selectMapItem(key, fromCard) {
      S.mapSel = key;
      document.querySelectorAll('.rail-card.sel').forEach(c => c.classList.remove('sel'));
      const card = document.querySelector(`.rail-card[data-key="${cssEsc(key)}"]`);
      if (card) {
        card.classList.add('sel');
        if (!fromCard && !S.mapSheetCollapsed) card.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
      }
      document.querySelectorAll('.pin.is-sel').forEach(p => p.classList.remove('is-sel'));
      const m = MK[key], el = m && m.getElement && m.getElement();
      const pin = el && el.querySelector('.pin');
      if (pin) pin.classList.add('is-sel');
    }

    function focusMarker(key) {
      const m = MK[key];
      if (!m || !leafletMap) return;
      selectMapItem(key, true);
      flyToVisible(m.getLatLng(), Math.max(leafletMap.getZoom(), 16), () => { try { m.openPopup(); } catch (e) { } });
    }

    function flyToVisible(ll, z, cb, animate = true) {
      if (!leafletMap) return;
      const p = mapPadding();
      const dx = (p.paddingBottomRight[0] - p.paddingTopLeft[0]) / 2;
      const dy = (p.paddingBottomRight[1] - p.paddingTopLeft[1]) / 2;
      const target = leafletMap.unproject(leafletMap.project(ll, z).add([dx, dy]), z);
      if (cb) leafletMap.once('moveend', cb);
      if (animate) leafletMap.flyTo(target, z, { duration: 0.6 });
      else leafletMap.setView(target, z, { animate: false });
    }

    function fitMap(animate) {
      if (!leafletMap || !mapLayersGroup) return;
      let b = null;
      try { b = mapLayersGroup.getBounds(); } catch (e) { }
      if (b && b.isValid()) leafletMap.fitBounds(b, Object.assign({ maxZoom: 16, animate: !!animate }, mapPadding()));
      else if (S.lastPos) flyToVisible(L.latLng(+S.lastPos.latitude, +S.lastPos.longitude), 14, null, !!animate);
    }

    async function locateMe() {
      const p = await getPos();
      drawMe();
      if (leafletMap) flyToVisible(L.latLng(+p.latitude, +p.longitude), Math.max(leafletMap.getZoom(), 16));
    }

    // --- Route playback ---
    function ensurePuck() {
      if (PB.puck || !PB.lls.length || !leafletMap) return;
      PB.puck = L.marker(PB.lls[0], {
        icon: L.divIcon({ className: 'sx-mk', html: '<div class="puck puck--pb"><span class="puck-halo"></span><span class="puck-core"></span></div>', iconSize: [22, 22], iconAnchor: [11, 11] }),
        interactive: false, keyboard: false, zIndexOffset: 1000
      }).addTo(leafletMap);
    }
    function togglePlayback() { PB.playing ? pausePlayback() : startPlayback(); }
    function startPlayback() {
      if (!PB.lls.length || !leafletMap) return;
      if (PB.idx >= PB.lls.length - 1) PB.idx = 0;
      ensurePuck();
      PB.rate = Math.max(PB.lls.length / 25, 0.6);   // whole day plays in ~25 s at 1×
      PB.pad = mapPadding();
      PB.playing = true;
      PB.last = performance.now();
      leafletMap.closePopup();
      updatePlayBtn();
      renderPlaybackAt(PB.idx, false);
      PB.raf = requestAnimationFrame(stepPlayback);
    }
    function stepPlayback(t) {
      if (!PB.playing) return;
      const dt = Math.min(0.1, Math.max(0, (t - PB.last) / 1000));
      PB.last = t;
      PB.idx = Math.min(PB.lls.length - 1, PB.idx + dt * PB.rate * PB.speed);
      renderPlaybackAt(PB.idx, true);
      if (PB.idx >= PB.lls.length - 1) { pausePlayback(); return; }
      PB.raf = requestAnimationFrame(stepPlayback);
    }
    function pausePlayback() {
      PB.playing = false;
      if (PB.raf) cancelAnimationFrame(PB.raf);
      PB.raf = null;
      updatePlayBtn();
    }
    function stopPlayback() {
      pausePlayback();
      if (PB.puck && leafletMap) { try { leafletMap.removeLayer(PB.puck); } catch (e) { } }
      PB.puck = null;
      PB.panning = false;
    }
    function updatePlayBtn() {
      const b = $('pb-play');
      if (!b) return;
      b.innerHTML = ic(PB.playing ? 'pause' : 'play', 18);
      b.setAttribute('aria-label', PB.playing ? 'Pause route' : 'Play route');
    }
    function scrubPlayback(v) {
      if (!PB.lls.length) return;
      pausePlayback();
      ensurePuck();
      PB.idx = Math.max(0, Math.min(PB.lls.length - 1, +v));
      renderPlaybackAt(PB.idx, false, true);
    }
    function cyclePlaybackSpeed() {
      const sp = [1, 2, 4, 8];
      PB.speed = sp[(sp.indexOf(PB.speed) + 1) % sp.length];
      const b = $('pb-speed'); if (b) b.textContent = PB.speed + '×';
    }
    function renderPlaybackAt(f, follow, fromRange) {
      const n = PB.lls.length;
      if (!n) return;
      const i = Math.min(n - 1, Math.floor(f)), fr = f - i;
      const a = PB.lls[i], b = PB.lls[Math.min(n - 1, i + 1)];
      const cur = L.latLng(a.lat + (b.lat - a.lat) * fr, a.lng + (b.lng - a.lng) * fr);
      if (PB.done) PB.done.setLatLngs(PB.lls.slice(0, i + 1).concat([cur]));
      if (PB.puck) PB.puck.setLatLng(cur);
      const r = $('pb-range');
      if (r) {
        if (!fromRange) r.value = f;
        r.style.setProperty('--p', (n > 1 ? f / (n - 1) * 100 : 100) + '%');
      }
      const now = $('pb-now');
      if (now) now.textContent = t12(PB.pts[i].time) || '';
      if (follow && leafletMap && !PB.panning) {
        const pt = leafletMap.latLngToContainerPoint(cur), size = leafletMap.getSize(), p = PB.pad || mapPadding();
        if (pt.x < p.paddingTopLeft[0] || pt.y < p.paddingTopLeft[1] || pt.x > size.x - p.paddingBottomRight[0] || pt.y > size.y - p.paddingBottomRight[1]) {
          PB.panning = true;
          leafletMap.once('moveend', () => { PB.panning = false; });
          flyToVisible(cur, leafletMap.getZoom(), null, true);
        }
      }
    }

    // --- Mode + filters ---
    function setSegUI(m) {
      const seg = $('map-seg'); if (!seg) return;
      seg.style.setProperty('--i', MAP_MODES.indexOf(m));
      seg.querySelectorAll('button').forEach(b => {
        const on = b.dataset.m === m;
        b.classList.toggle('on', on);
        b.setAttribute('aria-selected', String(on));
      });
    }
    function switchMapMode(m) {
      if (!MAP_MODES.includes(m) || S.mapMode === m) return;
      if (leafletMap) leafletMap.closePopup();
      S.mapMode = m;
      S.mapSel = null;
      setSegUI(m);
      closeLayerMenu();
      const body = $('ms-body'); if (body) body.innerHTML = '';
      if (S.mapData && leafletMap) {
        drawMapLayers(S.mapData);
        renderMapSheet(S.mapData);
        requestAnimationFrame(() => fitMap(true));
      } else {
        reloadMapData(true);
      }
    }
    function changeMapEmployee(emp) { S.mapTargetEmp = emp; S.mapSel = null; reloadMapData(true); }
    function changeMapDate(d) { if (!d) return; S.mapDate = d; S.mapSel = null; reloadMapData(true); }
    function changeMapTerritory(t) { S.mapTerritory = t; S.mapSel = null; reloadMapData(true); }

    function teardownMap() {
      stopPlayback();
      clearInterval(liveMapTimer);
      liveMapTimer = null;
      if (sheetRO) { sheetRO.disconnect(); sheetRO = null; }
      if (leafletMap) { try { leafletMap.remove(); } catch (e) { } }
      leafletMap = null; mapLayersGroup = null; tileLayer = null; meLayer = null;
      MK = {};
      document.body.classList.remove('map-on');
    }

    // =================================================================
    //  Auth / fatal
    // =================================================================
    function showLogin() {
      document.body.classList.add('logged-out');
      $('bottom-nav').style.display = 'none';
      $('hdr-greet').textContent = 'Field sales';
      $('header-user-date').textContent = 'Sales Executive';
      $('hdr-avatar').textContent = 'SE';
      paint(`
        <div class="login">
          <div class="login-card">
            <div class="brand-mark">${ic('pin', 28, 2.2)}</div>
            <h2>Sign in to start your day</h2>
            <p class="sub">Use your user ID or registered email</p>
            <form onsubmit="handleLoginSubmit(event)">
              <div class="field">
                <label class="field-label" for="login-usr">User ID or email</label>
                <div class="inp-ic">${ic('user', 18)}<input id="login-usr" placeholder="name@company.com" required autocapitalize="none" autocomplete="username"></div>
              </div>
              <div class="field">
                <label class="field-label" for="login-pwd">Password</label>
                <div class="inp-ic">${ic('lock', 18)}<input id="login-pwd" type="password" placeholder="Your password" required autocomplete="current-password"></div>
              </div>
              <button type="submit" class="btn primary lg" style="margin-top:8px">Sign in</button>
            </form>
          </div>
        </div>`);
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      await run('Signing in…', async () => {
        const fd = new FormData();
        fd.append('usr', $('login-usr').value.trim());
        fd.append('pwd', $('login-pwd').value);
        const r = await fetch('/api/method/login', { method: 'POST', body: fd, credentials: 'same-origin' });
        if (!r.ok) throw new Error('That user ID or password is not right. Check both and try again.');
        location.reload();
      });
    }

    async function doLogout() {
      const ok = await askConfirm({ title: 'Log out?', message: 'Location tracking stops until you sign in again.', ok: 'Log out', icon: 'power', tone: 'red' });
      if (!ok) return;
      await LiveShare.stop();
      await fetch('/api/method/logout', { credentials: 'same-origin' });
      location.reload();
    }

    function renderFatal(msg) {
      paint(`
        <section class="panel" style="margin-top:20px">
          ${emptyState('alert', 'The app could not load', msg || 'Check your connection and try again.', '<button class="btn ghost sm" onclick="location.reload()">Try again</button>')}
        </section>`);
    }

    // Start app
    init();

  </script>
</body>

</html>
