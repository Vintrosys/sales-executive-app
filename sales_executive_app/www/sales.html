    // ---------- 5. MAP VIEW (OpenStreetMap via Leaflet) ----------
    let leafletMap = null;
    let mapLayersGroup = null;
    let liveMapTimer = null;

    S.mapMode = 'live'; // 'live' | 'route' | 'shops'
    S.mapTargetEmp = null;
    S.mapDate = null;
    S.mapTerritory = null;

    async function renderMap(targetDate = null) {
      const d = targetDate || S.mapDate || (S.status ? S.status.date : null) || new Date().toISOString().slice(0, 10);
      S.mapDate = d;

      $('main-view').innerHTML = `
    <!-- Top Filter Bar -->
    <div class="card card-hero" style="padding-bottom:12px">
      <div class="card-title">
        <span>Map View (OpenStreetMap)</span>
        <span class="badge ok" id="map-refresh-indicator">Live OSM</span>
      </div>

      <!-- Mode Selector Pills -->
      <div class="map-filter-bar">
        <button class="map-pill ${S.mapMode === 'live' ? 'active' : ''}" onclick="switchMapMode('live')">
          🟢 Live Map
        </button>
        <button class="map-pill ${S.mapMode === 'route' ? 'active' : ''}" onclick="switchMapMode('route')">
          📍 Route Playback
        </button>
        <button class="map-pill ${S.mapMode === 'shops' ? 'active' : ''}" onclick="switchMapMode('shops')">
          🏪 Shop Map
        </button>
      </div>

      <!-- Filters (Salesperson, Date, Territory) -->
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px">
        <div style="flex:1;min-width:140px">
          <select id="map-emp-select" onchange="changeMapEmployee(this.value)" style="padding:8px 10px;font-size:13px">
            <option value="">Select Salesperson</option>
          </select>
        </div>
        <div style="width:130px">
          <input type="date" id="map-date-input" value="${d}" onchange="changeMapDate(this.value)" style="padding:6px 10px;font-size:13px">
        </div>
        <div style="width:110px">
          <select id="map-terr-select" onchange="changeMapTerritory(this.value)" style="padding:8px 10px;font-size:13px">
            <option value="">All Areas</option>
          </select>
        </div>
      </div>
    </div>

    <!-- Summary KPI Bar for Route/Live -->
    <div class="card" style="padding:10px 14px;margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div>
          <b id="map-salesperson-name">Loading...</b>
          <div class="item-subtitle" id="map-summary-sub">Status: Checking...</div>
        </div>
        <div style="text-align:right">
          <span class="stat-val" style="font-size:20px" id="map-km-txt">0.0</span> <span style="font-size:11px;font-weight:700">KM</span>
        </div>
      </div>
    </div>

    <!-- Map Canvas Container -->
    <div id="leaflet-map"></div>
    <div style="margin-top:6px;text-align:right;font-size:11px;color:var(--text-light)">
      Map layer: &copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" style="color:var(--primary);text-decoration:none">OpenStreetMap</a> contributors
    </div>
  `;

      initLeafletMapInstance();
      await reloadMapData();

      // Auto-refresh Live Map every 60s
      clearInterval(liveMapTimer);
      liveMapTimer = setInterval(() => {
        if (S.tab === 'map' && S.mapMode === 'live') {
          reloadMapData(false);
        }
      }, 60000);
    }

    function initLeafletMapInstance() {
      if (leafletMap) {
        try { leafletMap.remove(); } catch (e) { }
        leafletMap = null;
      }
      const defaultLat = (TEST ? TEST.lat : (S.lastPos ? S.lastPos.latitude : 11.0168));
      const defaultLng = (TEST ? TEST.lng : (S.lastPos ? S.lastPos.longitude : 76.9558));

      leafletMap = L.map('leaflet-map').setView([defaultLat, defaultLng], 13);
      L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
        maxZoom: 19,
        attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
      }).addTo(leafletMap);

      mapLayersGroup = L.featureGroup().addTo(leafletMap);
    }

    async function reloadMapData(showLoading = true) {
      try {
        if (showLoading) $('busy-text').textContent = 'Loading map data...';
        if (showLoading) $('busy').style.display = 'flex';

        const res = await api('get_map_view_data', {
          employee: S.mapTargetEmp,
          date: S.mapDate,
          territory: S.mapTerritory
        });
        S.mapData = res;

        // Populate salesperson dropdown
        const empSel = $('map-emp-select');
        if (empSel && (!empSel.options.length || empSel.options.length === 1)) {
          empSel.innerHTML = res.salespeople.map(sp => `
        <option value="${esc(sp.employee)}" ${sp.employee === res.selected_employee ? 'selected' : ''}>
          ${esc(sp.employee_name)} (${sp.status})
        </option>
      `).join('');
        }

        // Populate territory dropdown
        const terrSel = $('map-terr-select');
        if (terrSel && terrSel.options.length === 1 && S.meta.territories) {
          terrSel.innerHTML = '<option value="">All Areas</option>' + (S.meta.territories || []).map(t => `
        <option value="${esc(t)}" ${t === S.mapTerritory ? 'selected' : ''}>${esc(t)}</option>
      `).join('');
        }

        // Update KPI Bar
        const activeSp = res.salespeople.find(sp => sp.employee === res.selected_employee) || res.salespeople[0] || {};
        $('map-salesperson-name').textContent = activeSp.employee_name || 'Sales Executive';
        $('map-km-txt').textContent = res.km_travelled || '0.0';
        $('map-summary-sub').innerHTML = `
      Status: <span class="badge ${activeSp.color === 'green' ? 'ok' : activeSp.color === 'orange' ? 'warn' : ''}">${activeSp.status || 'Active'}</span>
      · Visits: <b>${res.visits.length}</b>
    `;

        drawMapLayers(res);
      } catch (e) {
        toast(e.message);
      } finally {
        if (showLoading) $('busy').style.display = 'none';
      }
    }

    function drawMapLayers(res) {
      if (!mapLayersGroup || !leafletMap) return;
      mapLayersGroup.clearLayers();

      const mode = S.mapMode;

      if (mode === 'live') {
        // 1. Live Map: One pin per salesperson at last known location
        // Colors: Green = On Duty & Active, Grey = Day Ended, Orange = GPS Off / Inactive
        res.salespeople.forEach(sp => {
          const loc = sp.last_location;
          if (loc && loc.latitude && loc.longitude) {
            const markerClass = sp.color === 'green' ? 'marker-green' : sp.color === 'orange' ? 'marker-orange' : 'marker-grey';
            const icon = L.divIcon({
              className: 'map-custom-marker ' + markerClass,
              html: `<div style="width:28px;height:28px;display:flex;align-items:center;justify-content:center;border-radius:50%">👤</div>`,
              iconSize: [28, 28],
              iconAnchor: [14, 14]
            });
            const m = L.marker([loc.latitude, loc.longitude], { icon: icon });
            m.bindPopup(`
          <div style="font-family:sans-serif;font-size:13px;line-height:1.4">
            <h4 style="margin:0 0 4px;font-size:15px">${esc(sp.employee_name)}</h4>
            <div>Status: <span class="badge ${sp.color === 'green' ? 'ok' : sp.color === 'orange' ? 'warn' : ''}">${esc(sp.status)}</span></div>
            <div>Clock In: <b>${sp.clock_in ? hm(sp.clock_in) : 'None'}</b></div>
            <div>Last Updated: <b>${sp.last_updated ? hm(sp.last_updated) : 'None'}</b></div>
            <div>Speed: <b>${loc.speed || 0} km/h</b> | Battery: <b>${loc.battery || 0}%</b></div>
          </div>
        `);
            mapLayersGroup.addLayer(m);
          }
        });
      } else if (mode === 'route') {
        // 2. Route Playback:
        const pts = res.route || [];
        if (pts.length > 0) {
          const latlngs = pts.map(p => [p.latitude, p.longitude]);
          const poly = L.polyline(latlngs, { color: '#2563eb', weight: 4.5, opacity: 0.85, smoothFactor: 1 });
          mapLayersGroup.addLayer(poly);

          // Start Marker (Clock In)
          const startIcon = L.divIcon({
            className: 'map-custom-marker marker-green',
            html: `<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%">🏁</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          const startMarker = L.marker(latlngs[0], { icon: startIcon }).bindPopup(`<b>Start / Clock In</b><br>Time: ${pts[0].time}`);
          mapLayersGroup.addLayer(startMarker);

          // End Marker (Last Location / Clock Out)
          if (latlngs.length > 1) {
            const endIcon = L.divIcon({
              className: 'map-custom-marker marker-red',
              html: `<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%">🛑</div>`,
              iconSize: [24, 24],
              iconAnchor: [12, 12]
            });
            const endMarker = L.marker(latlngs[latlngs.length - 1], { icon: endIcon }).bindPopup(`<b>Last Recorded Location</b><br>Time: ${pts[pts.length - 1].time}`);
            mapLayersGroup.addLayer(endMarker);
          }
        }

        // Visit checkpoints on Route:
        (res.visits || []).forEach((v, idx) => {
          if (v.latitude && v.longitude) {
            const isSusp = Boolean(v.is_suspicious);
            const icon = L.divIcon({
              className: 'map-custom-marker ' + (isSusp ? 'marker-red' : 'marker-blue'),
              html: `<div style="width:26px;height:26px;display:flex;align-items:center;justify-content:center;border-radius:50%">${isSusp ? '⚠️' : (idx + 1)}</div>`,
              iconSize: [26, 26],
              iconAnchor: [13, 13]
            });
            const m = L.marker([v.latitude, v.longitude], { icon: icon });
            m.bindPopup(`
          <div style="font-family:sans-serif;font-size:13px;line-height:1.4">
            <h4 style="margin:0 0 4px;font-size:15px">${esc(v.customer_name || v.customer)}</h4>
            ${isSusp ? '<span class="badge far" style="margin-bottom:4px">⚠️ Suspicious Visit</span><br>' : ''}
            <div>Check-in: <b>${hm(v.check_in_time)}</b></div>
            <div>Check-out: <b>${v.check_out_time ? hm(v.check_out_time) : 'In progress'}</b></div>
            <div>Waiting Time: <b>${v.waiting_time || 0} mins</b></div>
            <div>Order Qty: <b>${v.order_qty || 0} units</b> ${v.sales_order ? '(' + v.sales_order + ')' : ''}</div>
            ${v.distance_from_shop ? `<div>Distance from shop: <b>${Math.round(v.distance_from_shop)} m</b></div>` : ''}
          </div>
        `);
            mapLayersGroup.addLayer(m);
          }
        });
      } else if (mode === 'shops') {
        // 3. Shop Map: Customer pins with geofence circle
        (res.shops || []).forEach(s => {
          const radius = s.geofence_radius || 100;
          const circle = L.circle([s.latitude, s.longitude], {
            radius: radius,
            color: '#2563eb',
            fillColor: '#3b82f6',
            fillOpacity: 0.15,
            weight: 1.5
          });
          mapLayersGroup.addLayer(circle);

          const icon = L.divIcon({
            className: 'map-custom-marker marker-blue',
            html: `<div style="width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%">🏪</div>`,
            iconSize: [24, 24],
            iconAnchor: [12, 12]
          });
          const dispName = s.shop_name || s.customer_name;
          m.bindPopup(`
        <div style="font-family:sans-serif;font-size:13px;line-height:1.4">
          <h4 style="margin:0 0 4px;font-size:15px">${esc(dispName)}</h4>
          ${s.shop_name && s.customer_name && s.shop_name !== s.customer_name ? `<div>Customer: <b>${esc(s.customer_name)}</b></div>` : ''}
          ${s.contact_person ? `<div>Contact: <b>${esc(s.contact_person)}</b></div>` : ''}
          <div>Territory: <b>${esc(s.territory || 'Default')}</b></div>
          <div>Geofence: <b>${radius} m</b></div>
          ${s.mobile_no ? `<div>Phone: <a href="tel:${esc(s.mobile_no)}">${esc(s.mobile_no)}</a></div>` : ''}
          <div style="margin-top:6px">
            <button class="btn small green" onclick="selectShopForVisit('${esc(s.name)}')">Start Visit</button>
          </div>
        </div>
      `);
          mapLayersGroup.addLayer(m);
        });
      }

      // Auto-fit bounds
      try {
        const b = mapLayersGroup.getBounds();
        if (b && b.isValid()) {
          leafletMap.fitBounds(b, { padding: [35, 35], maxZoom: 16 });
        }
      } catch (e) { }
    }

    function switchMapMode(m) {
      S.mapMode = m;
      renderMap(S.mapDate);
    }

    function changeMapEmployee(emp) {
      S.mapTargetEmp = emp;
      reloadMapData();
    }

    function changeMapDate(d) {
      S.mapDate = d;
      reloadMapData();
    }

    function changeMapTerritory(t) {
      S.mapTerritory = t;
      reloadMapData();
    }

    // ---------- Auth / Fatal screens ----------
    function showLogin() {
      $('bottom-nav').style.display = 'none';
      $('main-view').innerHTML = `
    <div class="card" style="margin-top:30px;padding:24px">
      <div style="text-align:center;margin-bottom:20px">
        <div style="display:inline-flex;padding:12px;border-radius:16px;background:var(--primary-light);color:var(--primary);margin-bottom:10px">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        </div>
        <h2 style="margin:0;font-size:20px;font-weight:800">Sales Executive Login</h2>
        <p class="item-subtitle" style="margin-top:4px">Sign in with your user ID or mobile number</p>
      </div>
      <form onsubmit="handleLoginSubmit(event)">
        <div class="form-group">
          <label class="form-label">User ID / Email</label>
          <input id="login-usr" placeholder="Enter username or email" required autocapitalize="none">
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input id="login-pwd" type="password" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn" style="margin-top:16px">Sign In</button>
      </form>
    </div>
  `;
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      await run('Signing in...', async () => {
        const fd = new FormData();
        fd.append('usr', $('login-usr').value.trim());
        fd.append('pwd', $('login-pwd').value);
        const r = await fetch('/api/method/login', { method: 'POST', body: fd, credentials: 'same-origin' });
        if (!r.ok) throw new Error('Invalid username or password');
        location.reload();
      });
    }

    async function doLogout() {
      if (!confirm('Log out from Sales Executive App?')) return;
      await fetch('/api/method/logout', { credentials: 'same-origin' });
      location.reload();
    }

    function renderFatal(msg) {
      $('main-view').innerHTML = `
    <div class="card" style="margin-top:20px">
      <h3 style="color:var(--danger)">Unable to load application</h3>
      <p class="item-subtitle">${esc(msg)}</p>
      <button class="btn grey" onclick="location.reload()">Retry</button>
    </div>`;
    }

    // Start App
    init();
  </script>
  {% endraw %}
</body>

</html>
